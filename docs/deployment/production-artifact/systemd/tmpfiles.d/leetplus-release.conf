d /run/leetplus-release 0750 root leetplus-build -
f /run/leetplus-release/hydration.lock 0660 root leetplus-build -

# The lock inode is created by systemd-tmpfiles before any hydration unit. Both
# the build identity and root promoter open the same stable inode; neither unit
# replaces it, so serialization survives oneshot exit and promotion startup.
