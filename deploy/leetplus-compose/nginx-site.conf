# Install only after source fencing, target promotion, TLS and slot acceptance.
upstream leetplus_compose_api_blue { server 127.0.0.1:14100; keepalive 16; }
upstream leetplus_compose_api_green { server 127.0.0.1:14200; keepalive 16; }
upstream leetplus_compose_web_blue { server 127.0.0.1:13100; keepalive 16; }
upstream leetplus_compose_web_green { server 127.0.0.1:13200; keepalive 16; }
include /etc/nginx/leetplus-compose/active.conf;

server {
    listen 80;
    server_name leetplus.ru www.leetplus.ru api.leetplus.ru;
    location ^~ /.well-known/acme-challenge/ { root /srv/leetplus/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name leetplus.ru www.leetplus.ru;
    ssl_certificate /srv/leetplus/secrets/tls/fullchain.pem;
    ssl_certificate_key /srv/leetplus/secrets/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 168.222.143.243;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_max_body_size 6m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 90s;
    location = /register { access_log off; proxy_pass http://$leetplus_compose_web; }
    location ^~ /api/auth/invites/ { access_log off; client_max_body_size 16k; proxy_pass http://$leetplus_compose_web; }
    location /api/staff/team-chat/ { proxy_buffering off; proxy_read_timeout 3600s; proxy_pass http://$leetplus_compose_web; }
    location / { proxy_pass http://$leetplus_compose_web; }
}
server {
    listen 443 ssl;
    server_name api.leetplus.ru;
    ssl_certificate /srv/leetplus/secrets/tls/fullchain.pem;
    ssl_certificate_key /srv/leetplus/secrets/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 168.222.143.243;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_max_body_size 6m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 90s;
    location ^~ /auth/invites/ { access_log off; client_max_body_size 16k; proxy_pass http://$leetplus_compose_api; }
    location /staff/team-chat/ { proxy_buffering off; proxy_read_timeout 3600s; proxy_pass http://$leetplus_compose_api; }
    location / { proxy_pass http://$leetplus_compose_api; }
}
