name: Compose migration validation
on:
  pull_request:
    paths:
      - 'deploy/leetplus-compose/**'
      - 'apps/api/src/config/production-network-profile*'
      - 'apps/api/src/config/environment-validation*'
      - '.github/workflows/compose-validation.yml'
      - '.dockerignore'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compose-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Compose image and boundary validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CI_RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Match target Docker manifest store
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1
        with:
          version: v29.1.3
          set-host: true
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Verify controller and boundary negative matrix
        run: node --test deploy/leetplus-compose/*.test.mjs
      - name: Build exact non-deployable images
        run: bash deploy/leetplus-compose/build-images.sh "$RUNNER_TEMP/leetplus-compose"
      - name: Preserve validation metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: leetplus-compose-validation-${{ env.CI_RELEASE_SHA }}
          path: |
            ${{ runner.temp }}/leetplus-compose/release.json
            ${{ runner.temp }}/leetplus-compose/SHA256SUMS
          if-no-files-found: ignore
          retention-days: 7
