      - name: Validate CURRENT186 privileged deployment controller
        run: pnpm --filter database check:identity-mail-duty-role-deployment-current186

      - name: Validate independent CURRENT186 runtime-role attestation
        run: pnpm --filter database check:identity-mail-duty-role-runtime-attestation-v2

      - name: Validate CURRENT187 pre-Green cluster/application authority contract
        run: pnpm --filter database check:identity-mail-cluster-application-admission-current187-authority

      - name: Validate CURRENT187 pure cluster inventory planner
        run: pnpm --filter database check:identity-mail-cluster-inventory-current187-planner

      - name: Validate CURRENT187 read-only cluster acquisition adapter
        run: pnpm --filter database check:identity-mail-cluster-acquisition-current187
