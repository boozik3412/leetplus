      - name: Create deterministic release artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_RELEASE_SHA"

          node_realpath="$(realpath -e -- "$(command -v node)")"
          case "$node_realpath" in
            "$RUNNER_TOOL_CACHE"/node/22.*/x64/bin/node) ;;
            *) printf 'unexpected release verifier Node path: %s\n' "$node_realpath" >&2; exit 1 ;;
          esac
          node_directory="$(dirname -- "$node_realpath")"

          release_root="$RUNNER_TEMP/leetplus-release-$CI_RELEASE_SHA"
          archive="$RUNNER_TEMP/leetplus-release-$CI_RELEASE_SHA.tar.gz"
          test ! -e "$release_root"
          test ! -L "$release_root"
          test ! -e "$archive"
          test ! -L "$archive"
          mkdir -p \
            "$release_root/apps/api" \
            "$release_root/apps/web" \
            "$release_root/packages/database/prisma" \
            "$release_root/packages/database/scripts"

          cp -a apps/api/dist "$release_root/apps/api/"
          cp -a apps/api/package.json "$release_root/apps/api/"
          cp -a apps/web/.next "$release_root/apps/web/"
          cp -a apps/web/next.config.ts apps/web/package.json "$release_root/apps/web/"
          cp -a apps/web/public "$release_root/apps/web/"
          case "$release_root" in
            "$RUNNER_TEMP"/leetplus-release-"$CI_RELEASE_SHA") ;;
            *) printf 'unexpected generated release root\n' >&2; exit 1 ;;
          esac
          rm -rf -- \
            "$release_root/apps/web/.next/cache" \
            "$release_root/apps/web/.next/dev"
          cp -a packages/database/package.json "$release_root/packages/database/"
          cp -a packages/database/prisma/schema.prisma "$release_root/packages/database/prisma/"
          cp -a packages/database/prisma/migrations "$release_root/packages/database/prisma/"
          cp -a \
            packages/database/scripts/canonical-prisma-deploy.mjs \
            packages/database/scripts/founder-pilot-restored-copy-preflight.mjs \
            packages/database/scripts/founder-pilot-restored-copy-preflight.cli.mjs \
            packages/database/scripts/founder-pilot-production-history-rehearsal.mjs \
            packages/database/scripts/founder-pilot-production-history-rehearsal.cli.mjs \
            packages/database/scripts/founder-pilot-production-history-production.mjs \
            packages/database/scripts/founder-pilot-production-history-production.cli.mjs \
            packages/database/scripts/founder-pilot-current188-production-upgrade.mjs \
            packages/database/scripts/founder-pilot-current188-production-upgrade.cli.mjs \
            packages/database/scripts/founder-pilot-activation-role-deployment.mjs \
            packages/database/scripts/founder-pilot-activation-role-deployment.cli.mjs \
            packages/database/scripts/founder-pilot-activation-role-network-acceptance.mjs \
            packages/database/scripts/founder-pilot-activation-role-network-acceptance.cli.mjs \
            packages/database/scripts/founder-pilot-mail-tenant-enrollment.mjs \
            packages/database/scripts/founder-pilot-mail-tenant-enrollment.cli.mjs \
            packages/database/scripts/runtime-function-enrollment.mjs \
            packages/database/scripts/runtime-function-enrollment.cli.mjs \
            packages/database/scripts/identity-mail-worker-enrollment.mjs \
            packages/database/scripts/identity-mail-worker-enrollment.cli.mjs \
            packages/database/scripts/shared-beta-admission-provenance-catalog.mjs \
            packages/database/scripts/staff-task-integrity-migration-state.mjs \
            packages/database/scripts/current-release-restored-copy-runtime-acceptance.mjs \
            packages/database/scripts/current-release-restored-copy-runtime-acceptance.cli.mjs \
            docs/deployment/production-artifact/run-current-release-restored-copy-acceptance.sh \
            packages/database/scripts/current-network-access-scope-classification.mjs \
            packages/database/scripts/current-network-access-scope-classification.cli.mjs \
            packages/database/scripts/staff-attachment-backfill-dry-run.mjs \
            packages/database/scripts/staff-attachment-reconciliation.mjs \
            packages/database/scripts/staff-attachment-reconciliation.cli.mjs \
            "$release_root/packages/database/scripts/"
          cp -a package.json pnpm-lock.yaml pnpm-workspace.yaml "$release_root/"

          printf '%s\n' \
            '{' \
            "  \"releaseSha\": \"$CI_RELEASE_SHA\"," \
            '  "nodeVersion": "22",' \
            '  "pnpmVersion": "10.33.2",' \
            '  "databaseMigration": "20260828190000_guest_support_bug_reports",' \
            '  "databaseMigrationCount": 188,' \
            '  "runtimePackageManifestsIncluded": true,' \
            '  "canonicalPrismaDeployScriptsIncluded": true,' \
            '  "canonicalPrismaDeployScriptCount": 1,' \
            '  "founderPilotOperationalScriptsIncluded": true,' \
            '  "founderPilotOperationalScriptCount": 14,' \
            '  "runtimeEnrollmentOperationalScriptsIncluded": true,' \
            '  "runtimeEnrollmentOperationalScriptCount": 6,' \
            '  "currentReleaseRuntimeAcceptanceScriptsIncluded": true,' \
            '  "currentReleaseRuntimeAcceptanceScriptCount": 3,' \
            '  "currentNetworkAccessScopeClassificationScriptsIncluded": true,' \
            '  "currentNetworkAccessScopeClassificationScriptCount": 2,' \
            '  "staffAttachmentReconciliationScriptsIncluded": true,' \
            '  "staffAttachmentReconciliationScriptCount": 3,' \
            '  "operationalScriptCount": 29,' \
            '  "webPublicAssetsIncluded": true' \
            '}' > "$release_root/release-provenance.json"

          find "$release_root" -depth -mindepth 1 -type d -empty -delete

          (
            cd "$release_root"
            symlink_probe="$(mktemp "$RUNNER_TEMP/release-artifact-symlink-probe.XXXXXX")"
            find . -type l -print0 -quit > "$symlink_probe"
            if test -s "$symlink_probe"; then
              printf 'Release artifact refuses symbolic links\n' >&2
              exit 1
            fi
            rm -f -- "$symlink_probe"
            find . \
              -type f ! -path './SHA256SUMS' -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum --text > SHA256SUMS
          )

          release_root_real="$(realpath -e -- "$release_root")"
          test "$release_root_real" = "$release_root"
          /usr/bin/env -i \
            PATH="${node_directory}:/usr/bin:/bin" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            TZ=UTC \
            CI=true \
            GITHUB_ACTIONS=true \
            "$node_realpath" .github/scripts/verify-runtime-release-artifact.mjs \
              --release-root "$release_root_real" \
              --expected-release-sha "$CI_RELEASE_SHA"

          find "$release_root" -type d -exec chmod 0550 -- {} +
          find "$release_root" -type f -exec chmod 0440 -- {} +

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mode='u=rX,g=rX,o=' \
            --format=posix \
            --pax-option=delete=atime,delete=ctime \
            --exclude='./apps/web/.next/cache' \
            --exclude='./apps/web/.next/dev' \
            -C "$release_root" \
            -cf - . \
            | gzip -n > "$archive"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256"
            sha256sum --check "$(basename "$archive").sha256"
          )
          gzip --test "$archive"

          verification_root="$RUNNER_TEMP/leetplus-release-verify-$CI_RELEASE_SHA"
          archive_listing="$RUNNER_TEMP/leetplus-release-$CI_RELEASE_SHA.contents"
          test ! -e "$verification_root"
          test ! -L "$verification_root"
          mkdir -m 0700 "$verification_root"
          tar -tzf "$archive" > "$archive_listing"
          for required_path in \
            './apps/api/dist/main.js' \
            './apps/api/package.json' \
            './apps/web/package.json' \
            './apps/web/next.config.ts' \
            './apps/web/public/' \
            './packages/database/package.json' \
            './packages/database/prisma/schema.prisma' \
            './packages/database/scripts/canonical-prisma-deploy.mjs' \
            './packages/database/scripts/founder-pilot-restored-copy-preflight.cli.mjs' \
            './packages/database/scripts/founder-pilot-production-history-rehearsal.cli.mjs' \
            './packages/database/scripts/founder-pilot-production-history-production.cli.mjs' \
            './packages/database/scripts/founder-pilot-current188-production-upgrade.cli.mjs' \
            './packages/database/scripts/founder-pilot-activation-role-deployment.cli.mjs' \
            './packages/database/scripts/founder-pilot-activation-role-network-acceptance.cli.mjs' \
            './packages/database/scripts/founder-pilot-mail-tenant-enrollment.cli.mjs' \
            './packages/database/scripts/runtime-function-enrollment.cli.mjs' \
            './packages/database/scripts/identity-mail-worker-enrollment.cli.mjs' \
            './packages/database/scripts/current-release-restored-copy-runtime-acceptance.mjs' \
            './packages/database/scripts/current-release-restored-copy-runtime-acceptance.cli.mjs' \
            './packages/database/scripts/run-current-release-restored-copy-acceptance.sh' \
            './packages/database/scripts/current-network-access-scope-classification.mjs' \
            './packages/database/scripts/current-network-access-scope-classification.cli.mjs' \
            './packages/database/scripts/staff-attachment-backfill-dry-run.mjs' \
            './packages/database/scripts/staff-attachment-reconciliation.mjs' \
            './packages/database/scripts/staff-attachment-reconciliation.cli.mjs' \
            './release-provenance.json' \
            './SHA256SUMS'; do
            grep -F -x "$required_path" "$archive_listing" > /dev/null
          done
          if grep -E '(^|/)node_modules/' "$archive_listing" > /dev/null; then
            printf 'Release artifact must not embed node_modules\n' >&2
            exit 1
          fi
          script_file_count="$(grep -E '^\./packages/database/scripts/[^/]+$' "$archive_listing" | wc -l | tr -d ' ')"
          test "$script_file_count" = '29'
          if grep -E '^\./packages/database/scripts/.*(\.test\.|\.spec\.|\.pem$|\.key$)' "$archive_listing" > /dev/null; then
            printf 'Release artifact contains a forbidden operational fixture\n' >&2
            exit 1
          fi
          timeout --signal=TERM --kill-after=10s 120s \
