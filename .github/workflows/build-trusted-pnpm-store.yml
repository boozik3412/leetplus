name: Build exact trusted production pnpm store

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact admitted 40-character release SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trusted-pnpm-store-${{ inputs.release_sha }}
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.release_sha }}
  PNPM_VERSION: 10.33.2

jobs:
  build:
    name: Build Linux Node 22 production CAS and pnpm runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Validate requested release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$RELEASE_SHA"

      - name: Check out exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Install exact pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build the exact prewarmed production CAS
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          die() {
            printf 'build-trusted-pnpm-store: %s\n' "$*" >&2
            exit 1
          }
          [[ "$(node -p 'process.versions.node.split(".")[0]')" == '22' ]] \
            || die 'Node major differs from the reviewed build runtime'
          [[ "$(pnpm --version)" == "$PNPM_VERSION" ]] \
            || die 'pnpm version differs from the reviewed build runtime'
          store_root="$RUNNER_TEMP/leetplus-pnpm-store-$RELEASE_SHA"
          archive="$RUNNER_TEMP/leetplus-pnpm-store-$RELEASE_SHA.tar.gz"
          checksum="$archive.sha256"
          lockfile_copy="$RUNNER_TEMP/pnpm-lock-$RELEASE_SHA.yaml"
          receipt="$RUNNER_TEMP/leetplus-pnpm-store-$RELEASE_SHA.build-receipt.json"
          test ! -e "$store_root"
          install -d -m 0750 "$store_root"
          workspace_real="$(realpath -e "$GITHUB_WORKSPACE")"
          case "$workspace_real" in
            /home/runner/work/*/*) ;;
            *) printf 'unexpected disposable workspace: %s\n' "$workspace_real" >&2; exit 1 ;;
          esac

          pnpm fetch --prod --frozen-lockfile --ignore-scripts \
            --package-import-method=copy --store-dir "$store_root"
          if [[ -e "$workspace_real/node_modules" || -L "$workspace_real/node_modules" ]]; then
            test -d "$workspace_real/node_modules"
            test ! -L "$workspace_real/node_modules"
            rm -rf -- "$workspace_real/node_modules"
          fi
          if [[ -e "$store_root/v10/projects" || -L "$store_root/v10/projects" ]]; then
            test -d "$store_root/v10/projects"
            test ! -L "$store_root/v10/projects"
            rm -rf -- "$store_root/v10/projects"
          fi

          pnpm install --prod --offline --frozen-lockfile --side-effects-cache \
            --package-import-method=copy --store-dir "$store_root"
          prisma_engine_root='node_modules/.pnpm/@prisma+engines@6.19.3/node_modules/@prisma/engines'
          for prisma_engine in \
            schema-engine-debian-openssl-3.0.x \
            libquery_engine-debian-openssl-3.0.x.so.node; do
            prisma_engine_path="${prisma_engine_root}/${prisma_engine}"
            [[ -f "$prisma_engine_path" && ! -L "$prisma_engine_path" \
              && -s "$prisma_engine_path" ]] \
              || die "prewarmed Prisma engine is absent or unsafe: ${prisma_engine}"
          done
          prisma_engine_authority_root="$store_root/.leetplus-tools/prisma-engines/6.19.3/debian-openssl-3.0.x"
          install -d -m 0750 "$prisma_engine_authority_root"
          cp --reflink=never --no-preserve=ownership,mode,timestamps,links \
            "$prisma_engine_root/schema-engine-debian-openssl-3.0.x" \
            "$prisma_engine_authority_root/schema-engine"
          cp --reflink=never --no-preserve=ownership,mode,timestamps,links \
            "$prisma_engine_root/libquery_engine-debian-openssl-3.0.x.so.node" \
            "$prisma_engine_authority_root/libquery_engine-debian-openssl-3.0.x.so.node"
          chmod 0440 \
            "$prisma_engine_authority_root/schema-engine" \
            "$prisma_engine_authority_root/libquery_engine-debian-openssl-3.0.x.so.node"
          test "$(sha256sum "$prisma_engine_authority_root/schema-engine" | awk '{print $1}')" = \
            "$(sha256sum "$prisma_engine_root/schema-engine-debian-openssl-3.0.x" | awk '{print $1}')"
          test "$(sha256sum "$prisma_engine_authority_root/libquery_engine-debian-openssl-3.0.x.so.node" | awk '{print $1}')" = \
            "$(sha256sum "$prisma_engine_root/libquery_engine-debian-openssl-3.0.x.so.node" | awk '{print $1}')"
          for module_root in \
            "$workspace_real/node_modules" \
            "$workspace_real/apps/api/node_modules" \
            "$workspace_real/apps/web/node_modules" \
            "$workspace_real/packages/database/node_modules"; do
            if [[ -e "$module_root" || -L "$module_root" ]]; then
              [[ -d "$module_root" && ! -L "$module_root" ]] \
                || die "workspace module root is not one real directory: ${module_root}"
              rm -rf -- "$module_root"
              [[ ! -e "$module_root" && ! -L "$module_root" ]] \
                || die "workspace module root survived cleanup: ${module_root}"
            fi
          done
          if [[ -e "$store_root/v10/projects" || -L "$store_root/v10/projects" ]]; then
            test -d "$store_root/v10/projects"
            test ! -L "$store_root/v10/projects"
            rm -rf -- "$store_root/v10/projects"
          fi

          for trusted_component in "$store_root/v10/files" "$store_root/v10/index"; do
            [[ -d "$trusted_component" && ! -L "$trusted_component" \
              && "$(realpath -e -- "$trusted_component")" == "$trusted_component" \
              && -n "$(find -P "$trusted_component" -type f -print -quit)" ]] \
              || die "required trusted pnpm CAS component is absent: ${trusted_component}"
          done
          store_snapshot_before="$(
            cd "$store_root"
            find -P . -xdev -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | awk '{ print $1 }'
          )"
          find -P "$store_root" -xdev -type d -exec chmod a-w -- {} +
          find -P "$store_root" -xdev -type f -exec chmod a-w -- {} +
          install_store_dir="$RUNNER_TEMP/leetplus-pnpm-install-store-$RELEASE_SHA"
          test ! -e "$install_store_dir"
          install -d -m 0700 "$install_store_dir/v10"
          ln -s -- "$store_root/v10/files" "$install_store_dir/v10/files"
          ln -s -- "$store_root/v10/index" "$install_store_dir/v10/index"
          pnpm install --prod --offline --frozen-lockfile --ignore-scripts \
            --side-effects-cache-readonly --package-import-method=copy \
            --store-dir "$install_store_dir"
          prisma_engine_input_root="$RUNNER_TEMP/leetplus-prisma-engine-input-$RELEASE_SHA"
          test ! -e "$prisma_engine_input_root"
          install -d -m 0700 "$prisma_engine_input_root"
          cp --reflink=never --no-preserve=ownership,mode,timestamps,links \
            "$prisma_engine_authority_root/schema-engine" \
            "$prisma_engine_input_root/schema-engine"
          cp --reflink=never --no-preserve=ownership,mode,timestamps,links \
            "$prisma_engine_authority_root/libquery_engine-debian-openssl-3.0.x.so.node" \
            "$prisma_engine_input_root/libquery_engine-debian-openssl-3.0.x.so.node"
          chmod 0500 "$prisma_engine_input_root/schema-engine"
          chmod 0400 "$prisma_engine_input_root/libquery_engine-debian-openssl-3.0.x.so.node"
          PRISMA_SCHEMA_ENGINE_BINARY="$prisma_engine_input_root/schema-engine" \
          PRISMA_QUERY_ENGINE_LIBRARY="$prisma_engine_input_root/libquery_engine-debian-openssl-3.0.x.so.node" \
            pnpm --filter database db:generate
          mapfile -d '' -t generated_prisma_query_engines < <(
            find -P node_modules/.pnpm -xdev \
              -path '*/node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node' \
              -type f -print0
          )
          test "${#generated_prisma_query_engines[@]}" = 1
          test "$(sha256sum "${generated_prisma_query_engines[0]}" | awk '{print $1}')" = \
            "$(sha256sum "$prisma_engine_authority_root/libquery_engine-debian-openssl-3.0.x.so.node" | awk '{print $1}')"
          rm -rf -- "$prisma_engine_input_root"
          test ! -e "$prisma_engine_input_root"
          rm -rf -- "$install_store_dir"
          test ! -e "$install_store_dir"
          for module_root in \
            "$workspace_real/node_modules" \
            "$workspace_real/apps/api/node_modules" \
            "$workspace_real/apps/web/node_modules" \
            "$workspace_real/packages/database/node_modules"; do
            if [[ -e "$module_root" || -L "$module_root" ]]; then
              [[ -d "$module_root" && ! -L "$module_root" ]] \
                || die "production-like module root is not one real directory: ${module_root}"
              rm -rf -- "$module_root"
            fi
          done
          store_snapshot_after="$(
            cd "$store_root"
            find -P . -xdev -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | awk '{ print $1 }'
          )"
          [[ "$store_snapshot_after" == "$store_snapshot_before" ]] \
            || die 'production-like store wrapper changed the trusted pnpm CAS'
          [[ ! -e "$store_root/v10/projects" && ! -L "$store_root/v10/projects" ]] \
            || die 'production-like store wrapper wrote project state into the trusted CAS'
          find -P "$store_root" -xdev -type d -exec chmod u+w -- {} +
          find -P "$store_root" -xdev -type f -exec chmod u+w -- {} +

          pnpm_command_path="$(command -v pnpm)"
          pnpm_home="$(dirname -- "$pnpm_command_path")"
          pnpm_node_modules_root="$(dirname -- "$pnpm_home")"
          pnpm_runtime_source="$(realpath -e -- "$pnpm_node_modules_root/pnpm")"
          [[ "$(basename -- "$pnpm_command_path")" == 'pnpm' \
            && "$(basename -- "$pnpm_home")" == '.bin' \
            && "$(basename -- "$pnpm_node_modules_root")" == 'node_modules' ]] \
            || die 'pnpm action command layout is outside the reviewed envelope'
          case "$pnpm_runtime_source" in
            "$pnpm_node_modules_root"/pnpm|"$pnpm_node_modules_root"/.pnpm/pnpm@"$PNPM_VERSION"/node_modules/pnpm) ;;
            *) die "pnpm runtime source escaped the reviewed action root: ${pnpm_runtime_source}" ;;
          esac
          [[ -f "$pnpm_runtime_source/package.json" \
            && ! -L "$pnpm_runtime_source/package.json" \
            && -f "$pnpm_runtime_source/bin/pnpm.cjs" \
            && ! -L "$pnpm_runtime_source/bin/pnpm.cjs" \
            && -f "$pnpm_runtime_source/dist/pnpm.cjs" \
            && ! -L "$pnpm_runtime_source/dist/pnpm.cjs" ]] \
            || die 'pnpm runtime source lacks the reviewed regular files'
          [[ "$(node -p 'require(process.argv[1]).version' \
            "$pnpm_runtime_source/package.json")" == "$PNPM_VERSION" ]] \
            || die 'pnpm runtime package version differs from the requested version'
          [[ -z "$(find -P "$pnpm_runtime_source" -xdev ! -type d ! -type f -print -quit)" ]] \
            || die 'pnpm runtime source contains a link or special entry'
          pnpm_runtime_target="$store_root/.leetplus-tools/pnpm/$PNPM_VERSION"
          [[ ! -e "$pnpm_runtime_target" && ! -L "$pnpm_runtime_target" ]] \
            || die 'pnpm runtime target already exists'
          install -d -m 0750 "$pnpm_runtime_target"
          cp -R --reflink=never \
            --no-preserve=ownership,mode,timestamps,links \
            -- "$pnpm_runtime_source"/. "$pnpm_runtime_target"/
          [[ -z "$(find -P "$pnpm_runtime_target" -xdev ! -type d ! -type f -print -quit)" ]] \
            || die 'copied pnpm runtime contains a link or special entry'
          [[ -z "$(find -P "$pnpm_runtime_target" -xdev -type f -links +1 -print -quit)" ]] \
            || die 'copied pnpm runtime contains a shared hardlink'
          [[ "$(node "$pnpm_runtime_target/bin/pnpm.cjs" --version)" == "$PNPM_VERSION" ]] \
            || die 'copied pnpm runtime is not executable by the reviewed Node runtime'
          pnpm_runtime_entry_count="$(find -P "$pnpm_runtime_target" -xdev -mindepth 1 | wc -l | tr -d ' ')"
          pnpm_runtime_total_bytes="$(find -P "$pnpm_runtime_target" -xdev -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
          [[ "$pnpm_runtime_entry_count" -gt 0 && "$pnpm_runtime_entry_count" -le 5000 ]] \
            || die 'copied pnpm runtime entry count is outside the reviewed envelope'
          [[ "$pnpm_runtime_total_bytes" -gt 0 \
            && "$pnpm_runtime_total_bytes" -le 268435456 ]] \
            || die 'copied pnpm runtime byte count is outside the reviewed envelope'
          pnpm_runtime_tree_sha256="$(
            cd "$pnpm_runtime_target"
            find . -xdev -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          )"

          [[ -z "$(find -P "$store_root" -xdev ! -type d ! -type f -print -quit)" ]] \
            || die 'assembled store contains a link or special entry'
          [[ -z "$(find -P "$store_root" -xdev -type f -links +1 -print -quit)" ]] \
            || die 'assembled store contains a shared hardlink'
          [[ -n "$(find -P "$store_root" -xdev -type f -print -quit)" ]] \
            || die 'assembled store is empty'
          source_date_epoch="$(git show -s --format=%ct "$RELEASE_SHA")"
          tar --sort=name --mtime="@$source_date_epoch" \
            --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C "$store_root" .
          cp --reflink=never -- pnpm-lock.yaml "$lockfile_copy"
          (
            cd "$(dirname "$archive")"
            sha256sum --text "$(basename "$archive")" > "$(basename "$checksum")"
            sha256sum --check --strict --quiet "$(basename "$checksum")"
          )
          archive_sha="$(sha256sum "$archive" | awk '{print $1}')"
          lockfile_sha="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          store_file_count="$(find -P "$store_root" -xdev -type f | wc -l | tr -d ' ')"
          jq -n -S \
            --arg schemaVersion '1' \
            --arg state PASS \
            --arg releaseSha "$RELEASE_SHA" \
            --arg workflowSha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg nodeVersion "$(node --version)" \
            --arg pnpmVersion "$(pnpm --version)" \
            --arg pnpmRuntimeRelativePath ".leetplus-tools/pnpm/$PNPM_VERSION" \
            --arg pnpmRuntimeTreeSha256 "$pnpm_runtime_tree_sha256" \
            --arg archiveSha256 "$archive_sha" \
            --arg lockfileSha256 "$lockfile_sha" \
            --arg storeFileCount "$store_file_count" \
            '{
              schemaVersion: ($schemaVersion | tonumber),
              state: $state,
              releaseSha: $releaseSha,
              workflowSha: $workflowSha,
              runId: $runId,
              runAttempt: $runAttempt,
              nodeVersion: $nodeVersion,
              pnpmVersion: $pnpmVersion,
              pnpmRuntimeRelativePath: $pnpmRuntimeRelativePath,
              pnpmRuntimeTreeSha256: $pnpmRuntimeTreeSha256,
              archiveSha256: $archiveSha256,
              lockfileSha256: $lockfileSha256,
              storeFileCount: ($storeFileCount | tonumber)
            }' > "$receipt"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"
          printf 'lockfile=%s\n' "$lockfile_copy" >> "$GITHUB_OUTPUT"
          printf 'receipt=%s\n' "$receipt" >> "$GITHUB_OUTPUT"

      - name: Upload exact trusted pnpm store
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leetplus-pnpm-store-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.assemble.outputs.archive }}
            ${{ steps.assemble.outputs.checksum }}
            ${{ steps.assemble.outputs.lockfile }}
            ${{ steps.assemble.outputs.receipt }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
