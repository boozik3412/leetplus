          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release-artifact-api:
    name: Release artifact API child process
    needs: application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out exact fixture source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CI_RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact fixture checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CI_RELEASE_SHA"

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Snapshot exact root-owned CI hydration controller
        shell: bash
        run: |
          set -euo pipefail
          helper_source="$GITHUB_WORKSPACE/.github/scripts/hydrate-runtime-release-artifact-ci.sh"
          helper_sha256='4733314aabe981c786fbd3f5a825bcfceb8da9a4e6ec41561a77592629b19e43'
          authority_parent='/srv/leetplus-ci-runtime-authority'
          authority_root="$authority_parent/$CI_RELEASE_SHA"
          sudo -n /usr/bin/env -i \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            TZ=UTC \
            PATH=/usr/bin:/bin \
            /usr/bin/python3 -I -S -E - \
              "$helper_source" "$helper_sha256" "$CI_RELEASE_SHA" \
              "$authority_parent" "$authority_root" <<'PY'
          import hashlib
          import os
          import stat
          import sys

          source, expected, release_sha, parent, root = sys.argv[1:]
          if len(expected) != 64 or any(character not in "0123456789abcdef" for character in expected):
              raise SystemExit("CI hydration controller digest is not canonical")
          if len(release_sha) != 40 or any(character not in "0123456789abcdef" for character in release_sha):
              raise SystemExit("CI release SHA is not canonical")
          if parent != "/srv/leetplus-ci-runtime-authority" or root != f"{parent}/{release_sha}":
              raise SystemExit("CI hydration controller destination is outside its fixed authority")

          srv = os.lstat("/srv")
          if not stat.S_ISDIR(srv.st_mode) or srv.st_uid != 0 or srv.st_gid != 0 or srv.st_mode & 0o022:
              raise SystemExit("/srv is not a root-controlled authority ancestor")
          for path, mode in ((parent, 0o755), (root, 0o555)):
              try:
                  os.mkdir(path, mode)
              except FileExistsError:
                  raise SystemExit(f"CI hydration controller destination already exists: {path}")
              os.chown(path, 0, 0)
              os.chmod(path, mode)
              observed = os.lstat(path)
              if not stat.S_ISDIR(observed.st_mode) or observed.st_uid != 0 or observed.st_gid != 0:
                  raise SystemExit(f"CI hydration controller directory is unsafe: {path}")
              if stat.S_IMODE(observed.st_mode) != mode:
                  raise SystemExit(f"CI hydration controller directory mode is unsafe: {path}")

          destination = root + "/hydrate-runtime-release-artifact-ci.sh"
          source_fd = os.open(source, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW | os.O_NONBLOCK)
          destination_fd = -1
          try:
              before = os.fstat(source_fd)
              if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or not 1 <= before.st_size <= 4 * 1024 * 1024:
                  raise SystemExit("CI hydration controller source is not an exact bounded regular file")
              destination_fd = os.open(
                  destination,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_CLOEXEC | os.O_NOFOLLOW,
                  0o500,
              )
              digest = hashlib.sha256()
              total = 0
              while True:
                  chunk = os.read(source_fd, min(1024 * 1024, before.st_size - total + 1))
                  if not chunk:
                      break
                  total += len(chunk)
                  if total > before.st_size:
                      raise SystemExit("CI hydration controller source grew during snapshot")
                  digest.update(chunk)
                  view = memoryview(chunk)
                  while view:
                      written = os.write(destination_fd, view)
                      if written <= 0:
                          raise SystemExit("CI hydration controller snapshot made no write progress")
                      view = view[written:]
              if total != before.st_size or digest.hexdigest() != expected:
                  raise SystemExit("CI hydration controller differs from the reviewed exact byte")
              os.fchown(destination_fd, 0, 0)
              os.fchmod(destination_fd, 0o500)
              os.fsync(destination_fd)
              after = os.fstat(source_fd)
              path_after = os.stat(source, follow_symlinks=False)
              identity = ("st_dev", "st_ino", "st_size", "st_mtime_ns", "st_ctime_ns")
              if any(getattr(before, field) != getattr(after, field) for field in identity):
                  raise SystemExit("CI hydration controller descriptor changed during snapshot")
              if any(getattr(before, field) != getattr(path_after, field) for field in identity):
                  raise SystemExit("CI hydration controller pathname changed during snapshot")
              root_fd = os.open(root, os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC)
              try:
                  os.fsync(root_fd)
              finally:
                  os.close(root_fd)
          finally:
              if destination_fd >= 0:
                  os.close(destination_fd)
              os.close(source_fd)
          PY
          sudo -n /usr/bin/test \
            "$(sudo -n /usr/bin/stat -c '%u:%g:%a:%h' -- "$authority_root/hydrate-runtime-release-artifact-ci.sh")" = \
            '0:0:500:1'

      - name: Download exact SHA-bound release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: leetplus-release-${{ env.CI_RELEASE_SHA }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/leetplus-release-download

      - name: Verify and hydrate downloaded release artifact
        shell: bash
        run: |
          set -euo pipefail
          download_root="$RUNNER_TEMP/leetplus-release-download"
          archive="$download_root/leetplus-release-$CI_RELEASE_SHA.tar.gz"
          checksum="$archive.sha256"
          test "$(realpath -e -- "$download_root")" = "$download_root"
          download_inventory="$(mktemp "$RUNNER_TEMP/release-download-inventory.XXXXXX")"
          find -P "$download_root" -mindepth 1 -maxdepth 1 -print0 > "$download_inventory"
          download_entry_count=0
          while IFS= read -r -d '' _; do
            download_entry_count=$((download_entry_count + 1))
          done < "$download_inventory"
          rm -f -- "$download_inventory"
          test "$download_entry_count" = '2'
          for candidate_file in "$archive" "$checksum"; do
            test -f "$candidate_file"
            test ! -L "$candidate_file"
            test "$(stat -c '%h' -- "$candidate_file")" = '1'
            candidate_mode="$(stat -c '%a' -- "$candidate_file")"
            test "$((8#$candidate_mode & 8#22))" = '0'
          done
          test "$(wc -l < "$checksum" | tr -d ' ')" = '1'
          grep -E -x "[0-9a-f]{64}  leetplus-release-${CI_RELEASE_SHA}[.]tar[.]gz" "$checksum" > /dev/null
          (
            cd "$download_root"
            sha256sum --check --strict "$(basename "$checksum")"
          )
          gzip --test "$archive"

          node_realpath="$(realpath -e -- "$(command -v node)")"
          case "$node_realpath" in
            "$RUNNER_TOOL_CACHE"/node/22.*/x64/bin/node) ;;
            *) printf 'unexpected hydration Node path: %s\n' "$node_realpath" >&2; exit 1 ;;
          esac
          pnpm_command_path="$(command -v pnpm)"
          pnpm_realpath="$(realpath -e -- "$pnpm_command_path")"
          pnpm_home="$(dirname -- "$pnpm_command_path")"
          pnpm_node_modules_root="$(dirname -- "$pnpm_home")"
          pnpm_package_root="$(realpath -e -- "$pnpm_node_modules_root/pnpm")"
          runner_tool_cache_real="$(realpath -e -- "$RUNNER_TOOL_CACHE")"
          repository_root_real="$(realpath -e -- "$GITHUB_WORKSPACE")"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          hydration_authority="/srv/leetplus-ci-runtime-authority/$CI_RELEASE_SHA/hydrate-runtime-release-artifact-ci.sh"
          hydration_work_root="/srv/leetplus-ci-runtime-output/$CI_RELEASE_SHA"
          sudo -n \
              CI=true GITHUB_ACTIONS=true \
              LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC PATH=/usr/bin:/bin \
              /usr/bin/timeout --signal=TERM --kill-after=30s 720s \
              /usr/bin/bash -p "$hydration_authority" \
                --release-sha "$CI_RELEASE_SHA" \
                --repository-root "$repository_root_real" \
                --runner-tool-cache "$runner_tool_cache_real" \
                --node-path "$node_realpath" \
                --pnpm-path "$pnpm_realpath" \
                --pnpm-package-root "$pnpm_package_root" \
                --runner-uid "$runner_uid" \
                --runner-gid "$runner_gid" \
                --artifact "$archive" \
                --artifact-sha256 "$checksum" \
                --work-root "$hydration_work_root"
          hydrated_release_root="$hydration_work_root/releases/.untrusted-test-$CI_RELEASE_SHA"
          (
            cd "$hydrated_release_root"
            node -e "require.resolve('@nestjs/core', { paths: ['./apps/api'] })"
            node -e "require.resolve('@prisma/client', { paths: ['./apps/api'] })"
          )

      - name: Exercise downloaded artifact through a real API child process
        run: node .github/scripts/run-founder-release-artifact-api-fixture.mjs
        env:
          FOUNDER_RELEASE_ARTIFACT_API_CONFIRM: run-founder-release-artifact-api-child-process-fixture
          FOUNDER_RELEASE_ARTIFACT_ROOT: /srv/leetplus-ci-runtime-output/${{ env.CI_RELEASE_SHA }}/releases/.untrusted-test-${{ env.CI_RELEASE_SHA }}
          FOUNDER_RELEASE_ARTIFACT_MAINTENANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
          FOUNDER_RELEASE_ARTIFACT_API_PORT: 4319

      - name: Exercise downloaded Web artifact with its exact slot API origin
        run: node .github/scripts/run-release-artifact-web-pair-fixture.mjs
        env:
          RELEASE_ARTIFACT_WEB_PAIR_CONFIRM: run-release-artifact-web-pair-child-process-fixture
          RELEASE_ARTIFACT_WEB_PAIR_ROOT: /srv/leetplus-ci-runtime-output/${{ env.CI_RELEASE_SHA }}/releases/.untrusted-test-${{ env.CI_RELEASE_SHA }}
          RELEASE_ARTIFACT_WEB_PAIR_SHA: ${{ env.CI_RELEASE_SHA }}
          RELEASE_ARTIFACT_WEB_PAIR_API_PORT: 4320
          RELEASE_ARTIFACT_WEB_PAIR_WEB_PORT: 3320

