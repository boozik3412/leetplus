  production-control-candidate:
    name: Production-control candidate
    needs:
      - authority-root-trust
      - release-artifact-api
      - migration-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CI_RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact control checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CI_RELEASE_SHA"

      - name: Set up exact control Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build independently verified production-control candidate
        shell: bash
        run: |
          set -euo pipefail
          node_realpath="$(realpath -e -- "$(command -v node)")"
          runner_tool_cache_real="$(realpath -e -- "$RUNNER_TOOL_CACHE")"
          repository_root="$(realpath -e -- "$GITHUB_WORKSPACE")"
          case "$node_realpath" in
            "$runner_tool_cache_real"/node/22.*/x64/bin/node) ;;
            *) printf 'unexpected production-control Node path: %s\n' "$node_realpath" >&2; exit 1 ;;
          esac
          test "$("$node_realpath" -p 'process.versions.node.split(".")[0]')" = '22'
          # Normalize hosted-toolcache links and writable ancestors into a
          # byte-identical, root-owned source beneath the trusted /var/lib boundary.
          control_tool_cache_root="/var/lib/leetplus-production-control-node-$CI_RELEASE_SHA"
          control_node_root="$control_tool_cache_root/node/22.leetplus-control-$CI_RELEASE_SHA"
          control_node_path="$control_node_root/x64/bin/node"
          test ! -e "$control_tool_cache_root"
          test ! -L "$control_tool_cache_root"
          sudo -n /usr/bin/install -d -o root -g root -m 0755 -- \
            "$control_node_root/x64/bin"
          sudo -n /usr/bin/install -o root -g root -m 0555 -- \
            "$node_realpath" "$control_node_path"
          sudo -n /usr/bin/chmod 0555 -- \
            "$control_tool_cache_root" \
            "$control_tool_cache_root/node" \
            "$control_node_root" \
            "$control_node_root/x64" \
            "$control_node_root/x64/bin"
          control_tool_cache_real="$(realpath -e -- "$control_tool_cache_root")"
          control_node_realpath="$(realpath -e -- "$control_node_path")"
          test "$control_tool_cache_real" = "$control_tool_cache_root"
          test "$control_node_realpath" = "$control_node_path"
          test "$(stat -c '%u:%g:%a' -- "$control_tool_cache_real")" = '0:0:555'
          test "$(stat -c '%u:%g:%a:%h' -- "$control_node_realpath")" = '0:0:555:1'
          cmp --silent -- "$node_realpath" "$control_node_realpath"
          test "$("$control_node_realpath" -p 'process.versions.node.split(".")[0]')" = '22'
          test "$repository_root" = "$GITHUB_WORKSPACE"
          output_directory="$RUNNER_TEMP/leetplus-production-control-candidate-$CI_RELEASE_SHA"
          test ! -e "$output_directory"
          test ! -L "$output_directory"
          /usr/bin/env -i \
            CI=true \
            GITHUB_ACTIONS=true \
            GITHUB_SHA="$CI_RELEASE_SHA" \
            PRODUCTION_CONTROL_ARCHIVE_FIXTURE_CONFIRM=build-exact-git-production-control-artifact \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            TZ=UTC \
            PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            /usr/bin/bash -p "$repository_root/.github/scripts/build-production-control-artifact-ci.sh" \
              --release-sha "$CI_RELEASE_SHA" \
              --repository-root "$repository_root" \
              --runner-tool-cache "$control_tool_cache_real" \
              --node-path "$control_node_realpath" \
              --output-directory "$output_directory"

      - name: Upload non-deployable production-control candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leetplus-production-control-${{ env.CI_RELEASE_SHA }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/leetplus-production-control-candidate-${{ env.CI_RELEASE_SHA }}/leetplus-production-control-${{ env.CI_RELEASE_SHA }}.tar.gz
            ${{ runner.temp }}/leetplus-production-control-candidate-${{ env.CI_RELEASE_SHA }}/leetplus-production-control-${{ env.CI_RELEASE_SHA }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release-handoff:
    name: Admitted runtime and production-control handoff
    needs:
      - authority-root-trust
      - release-artifact-api
      - migration-smoke
      - production-control-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out exact handoff verifier source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CI_RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact handoff checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CI_RELEASE_SHA"

      - name: Set up exact handoff Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download exact runtime candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: leetplus-release-${{ env.CI_RELEASE_SHA }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-handoff-runtime-candidate

      - name: Download exact production-control candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: leetplus-production-control-${{ env.CI_RELEASE_SHA }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-handoff-control-candidate

      - name: Re-verify runtime candidate from a fresh checkout
        shell: bash
        run: |
          set -euo pipefail
          download_root="$RUNNER_TEMP/release-handoff-runtime-candidate"
          archive="$download_root/leetplus-release-$CI_RELEASE_SHA.tar.gz"
          checksum="$archive.sha256"
          extraction_root="$RUNNER_TEMP/release-handoff-runtime-root-$CI_RELEASE_SHA"
          test "$(realpath -e -- "$download_root")" = "$download_root"
          download_inventory="$(mktemp "$RUNNER_TEMP/runtime-handoff-inventory.XXXXXX")"
          find -P "$download_root" -mindepth 1 -maxdepth 1 -print0 > "$download_inventory"
          download_entry_count=0
          while IFS= read -r -d '' _; do
            download_entry_count=$((download_entry_count + 1))
          done < "$download_inventory"
          rm -f -- "$download_inventory"
          test "$download_entry_count" = '2'
          for candidate_file in "$archive" "$checksum"; do
            test -f "$candidate_file"
            test ! -L "$candidate_file"
            test "$(stat -c '%h' -- "$candidate_file")" = '1'
            candidate_mode="$(stat -c '%a' -- "$candidate_file")"
            test "$((8#$candidate_mode & 8#22))" = '0'
          done
          archive_size="$(stat -c '%s' -- "$archive")"
          checksum_size="$(stat -c '%s' -- "$checksum")"
          test "$archive_size" -gt 0
          test "$archive_size" -le 2147483648
          test "$checksum_size" -gt 0
          test "$checksum_size" -le 256
          test "$(wc -l < "$checksum" | tr -d ' ')" = '1'
          grep -E -x "[0-9a-f]{64}  leetplus-release-${CI_RELEASE_SHA}[.]tar[.]gz" "$checksum" > /dev/null
          (
            cd "$download_root"
            sha256sum --check --strict --quiet "$(basename "$checksum")"
          )
          timeout --signal=TERM --kill-after=10s 120s gzip --test "$archive"
          test ! -e "$extraction_root"
          test ! -L "$extraction_root"
          mkdir -m 0700 "$extraction_root"
          timeout --signal=TERM --kill-after=10s 120s \
            /usr/bin/env -i \
              PATH=/usr/bin:/bin \
              LANG=C.UTF-8 \
              LC_ALL=C.UTF-8 \
              TZ=UTC \
              /usr/bin/python3 -I -S -E \
                "$GITHUB_WORKSPACE/.github/scripts/extract-runtime-release-artifact.py" \
                --archive "$archive" \
                --destination "$extraction_root"
          node_realpath="$(realpath -e -- "$(command -v node)")"
          runner_tool_cache_real="$(realpath -e -- "$RUNNER_TOOL_CACHE")"
          case "$node_realpath" in
            "$runner_tool_cache_real"/node/22.*/x64/bin/node) ;;
            *) printf 'unexpected handoff runtime Node path: %s\n' "$node_realpath" >&2; exit 1 ;;
          esac
          node_directory="$(dirname -- "$node_realpath")"
          extraction_root_real="$(realpath -e -- "$extraction_root")"
          test "$extraction_root_real" = "$extraction_root"
          /usr/bin/env -i \
            PATH="${node_directory}:/usr/bin:/bin" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            TZ=UTC \
            CI=true \
            GITHUB_ACTIONS=true \
            "$node_realpath" "$GITHUB_WORKSPACE/.github/scripts/verify-runtime-release-artifact.mjs" \
              --release-root "$extraction_root_real" \
              --expected-release-sha "$CI_RELEASE_SHA"

      - name: Independently rebuild and compare production-control bytes
        shell: bash
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/release-handoff-control-candidate"
          candidate_archive="$candidate_root/leetplus-production-control-$CI_RELEASE_SHA.tar.gz"
          candidate_checksum="$candidate_archive.sha256"
          test "$(realpath -e -- "$candidate_root")" = "$candidate_root"
          candidate_inventory="$(mktemp "$RUNNER_TEMP/control-handoff-inventory.XXXXXX")"
          find -P "$candidate_root" -mindepth 1 -maxdepth 1 -print0 > "$candidate_inventory"
          candidate_entry_count=0
          while IFS= read -r -d '' _; do
            candidate_entry_count=$((candidate_entry_count + 1))
          done < "$candidate_inventory"
          rm -f -- "$candidate_inventory"
          test "$candidate_entry_count" = '2'
          for candidate_file in "$candidate_archive" "$candidate_checksum"; do
            test -f "$candidate_file"
            test ! -L "$candidate_file"
            test "$(stat -c '%h' -- "$candidate_file")" = '1'
            candidate_mode="$(stat -c '%a' -- "$candidate_file")"
            test "$((8#$candidate_mode & 8#22))" = '0'
          done
          test "$(wc -l < "$candidate_checksum" | tr -d ' ')" = '1'
          grep -E -x "[0-9a-f]{64}  leetplus-production-control-${CI_RELEASE_SHA}[.]tar[.]gz" \
            "$candidate_checksum" > /dev/null
          (
            cd "$candidate_root"
            sha256sum --check --strict --quiet "$(basename "$candidate_checksum")"
          )
          node_realpath="$(realpath -e -- "$(command -v node)")"
          runner_tool_cache_real="$(realpath -e -- "$RUNNER_TOOL_CACHE")"
          repository_root="$(realpath -e -- "$GITHUB_WORKSPACE")"
          case "$node_realpath" in
            "$runner_tool_cache_real"/node/22.*/x64/bin/node) ;;
            *) printf 'unexpected handoff control Node path: %s\n' "$node_realpath" >&2; exit 1 ;;
          esac
          # Recreate the same root-owned trust path for independent rebuild.
          control_tool_cache_root="/var/lib/leetplus-production-control-node-$CI_RELEASE_SHA"
          control_node_root="$control_tool_cache_root/node/22.leetplus-control-$CI_RELEASE_SHA"
          control_node_path="$control_node_root/x64/bin/node"
          test ! -e "$control_tool_cache_root"
          test ! -L "$control_tool_cache_root"
          sudo -n /usr/bin/install -d -o root -g root -m 0755 -- \
            "$control_node_root/x64/bin"
          sudo -n /usr/bin/install -o root -g root -m 0555 -- \
            "$node_realpath" "$control_node_path"
          sudo -n /usr/bin/chmod 0555 -- \
            "$control_tool_cache_root" \
            "$control_tool_cache_root/node" \
            "$control_node_root" \
            "$control_node_root/x64" \
            "$control_node_root/x64/bin"
          control_tool_cache_real="$(realpath -e -- "$control_tool_cache_root")"
          control_node_realpath="$(realpath -e -- "$control_node_path")"
          test "$control_tool_cache_real" = "$control_tool_cache_root"
          test "$control_node_realpath" = "$control_node_path"
          test "$(stat -c '%u:%g:%a' -- "$control_tool_cache_real")" = '0:0:555'
          test "$(stat -c '%u:%g:%a:%h' -- "$control_node_realpath")" = '0:0:555:1'
          cmp --silent -- "$node_realpath" "$control_node_realpath"
          test "$("$control_node_realpath" -p 'process.versions.node.split(".")[0]')" = '22'
          rebuilt_root="$RUNNER_TEMP/release-handoff-control-rebuilt-$CI_RELEASE_SHA"
          test ! -e "$rebuilt_root"
          test ! -L "$rebuilt_root"
          /usr/bin/env -i \
            CI=true \
            GITHUB_ACTIONS=true \
            GITHUB_SHA="$CI_RELEASE_SHA" \
            PRODUCTION_CONTROL_ARCHIVE_FIXTURE_CONFIRM=build-exact-git-production-control-artifact \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            TZ=UTC \
            PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            /usr/bin/bash -p "$repository_root/.github/scripts/build-production-control-artifact-ci.sh" \
              --release-sha "$CI_RELEASE_SHA" \
              --repository-root "$repository_root" \
              --runner-tool-cache "$control_tool_cache_real" \
              --node-path "$control_node_realpath" \
              --output-directory "$rebuilt_root"
          rebuilt_archive="$rebuilt_root/leetplus-production-control-$CI_RELEASE_SHA.tar.gz"
          rebuilt_checksum="$rebuilt_archive.sha256"
          cmp --silent -- "$candidate_archive" "$rebuilt_archive"
          cmp --silent -- "$candidate_checksum" "$rebuilt_checksum"

      - name: Freeze admitted handoff payloads
        shell: bash
        run: |
          set -euo pipefail
          publication_root="$RUNNER_TEMP/release-handoff-publication-$CI_RELEASE_SHA"
          test ! -e "$publication_root"
          test ! -L "$publication_root"
          install -d -m 0700 \
            "$publication_root/runtime" \
            "$publication_root/control" \
            "$publication_root/admission"
          install -m 0440 \
            "$RUNNER_TEMP/release-handoff-runtime-candidate/leetplus-release-$CI_RELEASE_SHA.tar.gz" \
            "$RUNNER_TEMP/release-handoff-runtime-candidate/leetplus-release-$CI_RELEASE_SHA.tar.gz.sha256" \
            "$publication_root/runtime/"
          install -m 0440 \
            "$RUNNER_TEMP/release-handoff-control-candidate/leetplus-production-control-$CI_RELEASE_SHA.tar.gz" \
            "$RUNNER_TEMP/release-handoff-control-candidate/leetplus-production-control-$CI_RELEASE_SHA.tar.gz.sha256" \
            "$publication_root/control/"
          runtime_digest="$(sha256sum "$publication_root/runtime/leetplus-release-$CI_RELEASE_SHA.tar.gz")"
          runtime_digest="${runtime_digest%% *}"
          control_digest="$(sha256sum "$publication_root/control/leetplus-production-control-$CI_RELEASE_SHA.tar.gz")"
          control_digest="${control_digest%% *}"
          printf '%s\n' "$runtime_digest" > "$publication_root/admission/runtime-archive.sha256"
          printf '%s\n' "$control_digest" > "$publication_root/admission/control-archive.sha256"
          chmod 0440 "$publication_root/admission/"*.sha256

      - name: Upload verified runtime handoff payload
        id: upload_runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leetplus-release-${{ env.CI_RELEASE_SHA }}-handoff-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-handoff-publication-${{ env.CI_RELEASE_SHA }}/runtime/leetplus-release-${{ env.CI_RELEASE_SHA }}.tar.gz
            ${{ runner.temp }}/release-handoff-publication-${{ env.CI_RELEASE_SHA }}/runtime/leetplus-release-${{ env.CI_RELEASE_SHA }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload verified production-control handoff payload
        id: upload_control
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leetplus-production-control-${{ env.CI_RELEASE_SHA }}-handoff-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-handoff-publication-${{ env.CI_RELEASE_SHA }}/control/leetplus-production-control-${{ env.CI_RELEASE_SHA }}.tar.gz
            ${{ runner.temp }}/release-handoff-publication-${{ env.CI_RELEASE_SHA }}/control/leetplus-production-control-${{ env.CI_RELEASE_SHA }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Bind admission receipt to uploaded transport artifacts
        shell: bash
        env:
          RUNTIME_ARTIFACT_ID: ${{ steps.upload_runtime.outputs.artifact-id }}
          RUNTIME_TRANSPORT_DIGEST: ${{ steps.upload_runtime.outputs.artifact-digest }}
          CONTROL_ARTIFACT_ID: ${{ steps.upload_control.outputs.artifact-id }}
          CONTROL_TRANSPORT_DIGEST: ${{ steps.upload_control.outputs.artifact-digest }}
          RECEIPT_REPOSITORY: ${{ github.repository }}
          RECEIPT_REPOSITORY_ID: ${{ github.repository_id }}
          RECEIPT_WORKFLOW_REF: ${{ github.workflow_ref }}
          RECEIPT_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/release-handoff-publication-$CI_RELEASE_SHA/admission/leetplus-release-admission-$CI_RELEASE_SHA.json"
          test ! -e "$receipt"
          test ! -L "$receipt"
          runtime_payload_digest="$(< "$RUNNER_TEMP/release-handoff-publication-$CI_RELEASE_SHA/admission/runtime-archive.sha256")"
          control_payload_digest="$(< "$RUNNER_TEMP/release-handoff-publication-$CI_RELEASE_SHA/admission/control-archive.sha256")"
          [[ "$runtime_payload_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$control_payload_digest" =~ ^[0-9a-f]{64}$ ]]
          runtime_artifact_id="$RUNTIME_ARTIFACT_ID"
          runtime_transport_digest="$RUNTIME_TRANSPORT_DIGEST"
          control_artifact_id="$CONTROL_ARTIFACT_ID"
          control_transport_digest="$CONTROL_TRANSPORT_DIGEST"
          [[ "$runtime_artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$control_artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$runtime_transport_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$control_transport_digest" =~ ^[0-9a-f]{64}$ ]]
          repository="$RECEIPT_REPOSITORY"
          repository_id="$RECEIPT_REPOSITORY_ID"
          workflow_ref="$RECEIPT_WORKFLOW_REF"
          workflow_sha="$RECEIPT_WORKFLOW_SHA"
          [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$repository_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$workflow_ref" == "${repository}/.github/workflows/ci.yml@"* ]]
          [[ "$workflow_sha" == "$CI_RELEASE_SHA" ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          node_realpath="$(realpath -e -- "$(command -v node)")"
          runner_tool_cache_real="$(realpath -e -- "$RUNNER_TOOL_CACHE")"
          case "$node_realpath" in
            "$runner_tool_cache_real"/node/22.*/x64/bin/node) ;;
            *) printf 'unexpected admission-receipt Node path: %s\n' "$node_realpath" >&2; exit 1 ;;
          esac
          node_directory="$(dirname -- "$node_realpath")"
          /usr/bin/env -i \
            PATH="${node_directory}:/usr/bin:/bin" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            TZ=UTC \
            "$node_realpath" - "$receipt" \
            "$CI_RELEASE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$repository" "$repository_id" "$workflow_ref" "$workflow_sha" \
            "$runtime_payload_digest" "$control_payload_digest" \
            "$runtime_artifact_id" "$runtime_transport_digest" \
            "$control_artifact_id" "$control_transport_digest" <<'NODE'
          const fs = require("node:fs");
          const [
            receiptPath,
            releaseSha,
            runId,
            runAttempt,
            repository,
            repositoryId,
            workflowRef,
            workflowSha,
            runtimePayloadDigest,
            controlPayloadDigest,
            runtimeId,
            runtimeTransportDigest,
            controlId,
            controlTransportDigest,
          ] = process.argv.slice(2);
          const receipt = {
            schemaVersion: 1,
            admission: "PASS",
            releaseSha,
            runId,
            runAttempt,
            repository,
            repositoryId,
            workflowRef,
            workflowSha,
            runtimeArtifactName: `leetplus-release-${releaseSha}-handoff-payload-${runId}-${runAttempt}`,
            runtimeArchiveSha256: runtimePayloadDigest,
            productionControlArtifactName:
              `leetplus-production-control-${releaseSha}-handoff-payload-${runId}-${runAttempt}`,
            productionControlArchiveSha256: controlPayloadDigest,
            runtimeArtifactId: runtimeId,
            runtimeTransportDigest,
            productionControlArtifactId: controlId,
            productionControlTransportDigest: controlTransportDigest,
          };
          fs.writeFileSync(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`, {
            encoding: "utf8",
            flag: "wx",
            mode: 0o440,
          });
          NODE
          chmod 0440 "$receipt"
          (
            cd "$(dirname -- "$receipt")"
            sha256sum --text "$(basename -- "$receipt")" \
              > "$(basename -- "$receipt").sha256"
            chmod 0440 "$(basename -- "$receipt").sha256"
            sha256sum --check --strict --quiet "$(basename -- "$receipt").sha256"
          )

      - name: Upload final admission receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leetplus-release-admission-${{ env.CI_RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-handoff-publication-${{ env.CI_RELEASE_SHA }}/admission/leetplus-release-admission-${{ env.CI_RELEASE_SHA }}.json
            ${{ runner.temp }}/release-handoff-publication-${{ env.CI_RELEASE_SHA }}/admission/leetplus-release-admission-${{ env.CI_RELEASE_SHA }}.json.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
