      - name: Validate sealed CURRENT185 tenant enrollment coordinator boundary
        run: pnpm --filter database check:identity-mail-tenant-enrollment-coordinator-current185

      - name: Validate CURRENT185 identity-mail duty-role grants catalog
        run: pnpm --filter database check:identity-mail-duty-role-grants-current185

      - name: Validate CURRENT185 signed identity-mail duty-role manifest
        run: pnpm --filter database check:identity-mail-duty-role-manifest-current185

      - name: Validate manifest-bound identity-mail tenant enrollment authority V2
        run: pnpm --filter database check:identity-mail-tenant-enrollment-authority-v2

      - name: Validate successor identity-mail duty-role Manifest V2
        run: pnpm --filter database check:identity-mail-duty-role-manifest-v2

      - name: Validate two-PINNED identity-mail enrollment composition V2
        run: pnpm --filter database check:identity-mail-tenant-enrollment-manifest-bound-v2

      - name: Validate sealed owner-only enrollment evidence importer V2
