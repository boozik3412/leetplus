      - name: Validate CURRENT187 persisted DDL-fence consumption and revocation ledger
        run: pnpm --filter database check:identity-mail-ddl-fence-ledger-current187
        env:
          NODE_ENV: test

      - name: Validate dormant CURRENT188 Langame onboarding receipt contract
        run: pnpm --filter database check:langame-onboarding-staged-receipt-current188

      - name: Validate dormant CURRENT191 Langame initial-sync approval contract
        run: pnpm --filter database check:langame-initial-sync-approval-current191

      - name: Validate dormant CURRENT192 Langame initial-sync execution contract
        run: pnpm --filter database check:langame-initial-sync-execution-current192

      - name: Validate nonauthorizing CURRENT193 Langame runtime boundary
        run: pnpm --filter database check:langame-initial-sync-runtime-current193

      - name: Validate dormant CURRENT189 employee invitation contract
        run: pnpm --filter database check:identity-employee-invite-mail-current189

      - name: Validate dormant CURRENT190 persisted guest session contract
        run: pnpm --filter database check:guest-portal-session-current190

      - name: Prove frozen foundation pins and CURRENT180-CURRENT190 rehearsal remain fail-closed
        run: pnpm --filter database check:current180-current190-release-rehearsal-blocker

      - name: Validate deny-only CURRENT180-CURRENT190 materialization plan
        run: pnpm --filter database check:current180-current190-release-materialization-planner
        env:
