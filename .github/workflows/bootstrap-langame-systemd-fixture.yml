name: Bootstrap Langame systemd fixture image

on:
  push:
    branches:
      - codex/langame-systemd-fixture-bootstrap
    paths:
      - .github/fixtures/langame-systemd-noble/Dockerfile
      - .github/fixtures/langame-systemd-noble/leetplus-langame-fixture.target
      - .github/fixtures/langame-systemd-noble/ubuntu-snapshot.sources
      - .github/workflows/bootstrap-langame-systemd-fixture.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: langame-systemd-fixture-bootstrap-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact fixture source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build, attest and publish one immutable amd64 image
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          umask 0077
          trap 'status=$?; printf "LANGAME_SYSTEMD_BOOTSTRAP_FAILED line=%s status=%s\n" "$LINENO" "$status" >&2; exit "$status"' ERR
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = x86_64
          test -f /usr/bin/podman && test ! -L /usr/bin/podman
          test "$(stat -c '%U:%G:%h' -- /usr/bin/podman)" = root:root:1
          test -z "$(find -P /usr/bin/podman -maxdepth 0 -perm /022 -print -quit)"
          printf 'PODMAN_AUTHORITY_PATH=/usr/bin/podman\n'
          podman_short() { timeout --foreground --kill-after=10s 60s /usr/bin/podman "$@"; }
          podman_long() { timeout --foreground --kill-after=30s 900s /usr/bin/podman "$@"; }
          test "$(podman_short info --format '{{.Host.Security.Rootless}}')" = true
          test "$(podman_short info --format '{{.Host.CgroupsVersion}}')" = v2
          subuid_capacity="$(awk -F: -v user="$(id -un)" '$1 == user { total += $3 } END { print total + 0 }' /etc/subuid)"
          subgid_capacity="$(awk -F: -v user="$(id -un)" '$1 == user { total += $3 } END { print total + 0 }' /etc/subgid)"
          test "$subuid_capacity" -ge 65536
          test "$subgid_capacity" -ge 65536
          image="ghcr.io/boozik3412/leetplus-langame-systemd-fixture:bootstrap-${GITHUB_SHA}"
          auth_file="$RUNNER_TEMP/leetplus-langame-systemd-fixture-auth.json"
          digest_file="$RUNNER_TEMP/leetplus-langame-systemd-fixture.digest"
          run_identity="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          build_context="$RUNNER_TEMP/leetplus-langame-systemd-bootstrap-context.${run_identity}"
          host_ca_input='/etc/ssl/certs/ca-certificates.crt'
          host_ca_bundle="$(realpath -e -- "$host_ca_input")"
          container="leetplus-langame-systemd-bootstrap-${run_identity}"
          label_key='io.leetplus.langame-systemd-bootstrap-run'
          label="${label_key}=${run_identity}"
          container_id=''
          retired_container_id=''
          auth_armed=false
          build_context_armed=false

          cleanup() {
            original_status=$?
            cleanup_status=0
            trap - EXIT INT TERM HUP
            set +e
            mapfile -t ids < <(podman_short ps -aq --no-trunc --filter "label=${label}" 2>/dev/null)
            for id in "${ids[@]}"; do
              [[ -z "$container_id" || "$id" == "$container_id" ]] || cleanup_status=1
              test "$(podman_short inspect --format "{{index .Config.Labels \"${label_key}\"}}" "$id")" = "$run_identity" || cleanup_status=1
              test "$(podman_short inspect --format '{{.Name}}' "$id")" = "$container" || cleanup_status=1
              if ((original_status != 0)); then podman_short logs --tail 250 "$id" >&2 || true; fi
              timeout --foreground --kill-after=5s 20s /usr/bin/podman stop --time 10 "$id" >/dev/null 2>&1 || true
              podman_short rm -f "$id" >/dev/null 2>&1 || cleanup_status=1
            done
            if [[ "$auth_armed" == true ]]; then
              podman_short logout --authfile "$auth_file" ghcr.io >/dev/null 2>&1 || cleanup_status=1
            fi
            rm -f -- "$auth_file" "$digest_file" || cleanup_status=1
            case "$build_context" in "$RUNNER_TEMP"/leetplus-langame-systemd-bootstrap-context."${run_identity}") ;; *) cleanup_status=1 ;; esac
            if [[ "$build_context_armed" == true && ( -e "$build_context" || -L "$build_context" ) ]]; then
              test -d "$build_context" && test ! -L "$build_context" || cleanup_status=1
              test -z "$(find -P "$build_context" -xdev -type l -print -quit 2>/dev/null)" || cleanup_status=1
              rm -rf -- "$build_context" || cleanup_status=1
            fi
            ((original_status != 0)) && exit "$original_status"
            exit "$cleanup_status"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          test ! -e "$auth_file" && test ! -L "$auth_file"
          test ! -e "$digest_file" && test ! -L "$digest_file"
          test ! -e "$build_context" && test ! -L "$build_context"
          test -z "$(podman_short ps -aq --no-trunc --filter "label=${label}")"
          auth_armed=true
          printf '%s' "$GHCR_TOKEN" | podman_short login \
            --authfile "$auth_file" \
            --username "$GITHUB_ACTOR" \
            --password-stdin \
            ghcr.io >/dev/null
          unset GHCR_TOKEN
          test "$(stat -c '%u:%g:%a:%h' -- "$auth_file")" = "$(id -u):$(id -g):600:1"
          case "$host_ca_bundle" in /etc/ssl/certs/*|/usr/share/ca-certificates/*) ;; *) exit 81 ;; esac
          test -f "$host_ca_bundle" && test ! -L "$host_ca_bundle"
          test "$(stat -c '%U:%G' -- "$host_ca_bundle")" = root:root
          test -z "$(find -P "$host_ca_bundle" -maxdepth 0 -perm /022 -print -quit)"
          ca_bundle_identity="$(stat -c '%d:%i:%s:%Y:%Z:%U:%G:%a:%h' -- "$host_ca_bundle")"
          ca_bundle_sha256="$(sha256sum "$host_ca_bundle" | awk '{print $1}')"
          [[ "$ca_bundle_sha256" =~ ^[0-9a-f]{64}$ ]]
          install -d -o "$(id -u)" -g "$(id -g)" -m 0700 -- "$build_context"
          build_context_armed=true
          test "$(stat -c '%u:%g:%a:%h' -- "$build_context")" = "$(id -u):$(id -g):700:2"
          for source in \
            .github/fixtures/langame-systemd-noble/Dockerfile \
            .github/fixtures/langame-systemd-noble/leetplus-langame-fixture.target \
            .github/fixtures/langame-systemd-noble/ubuntu-snapshot.sources; do
            test -f "$source" && test ! -L "$source"
            source_identity="$(stat -c '%d:%i:%s:%Y:%Z:%U:%G:%a:%h' -- "$source")"
            source_sha256="$(sha256sum "$source" | awk '{print $1}')"
            install -o "$(id -u)" -g "$(id -g)" -m 0444 -- "$source" "$build_context/$(basename "$source")"
            test "$(stat -c '%d:%i:%s:%Y:%Z:%U:%G:%a:%h' -- "$source")" = "$source_identity"
            test "$(sha256sum "$source" | awk '{print $1}')" = "$source_sha256"
            test "$(sha256sum "$build_context/$(basename "$source")" | awk '{print $1}')" = "$source_sha256"
          done
          install -o "$(id -u)" -g "$(id -g)" -m 0444 -- "$host_ca_bundle" "$build_context/bootstrap-ca-certificates.crt"
          test "$(stat -c '%d:%i:%s:%Y:%Z:%U:%G:%a:%h' -- "$host_ca_bundle")" = "$ca_bundle_identity"
          test "$(sha256sum "$host_ca_bundle" | awk '{print $1}')" = "$ca_bundle_sha256"
          test "$(sha256sum "$build_context/bootstrap-ca-certificates.crt" | awk '{print $1}')" = "$ca_bundle_sha256"
          snapshot_sources_sha256="$(sha256sum "$build_context/ubuntu-snapshot.sources" | awk '{print $1}')"
          test "$snapshot_sources_sha256" = 2aecb1f023a3c426c9409b98a81b23ca6fc045c1ae47f1ce59001b6f86470ae4
          podman_long build \
            --pull-always \
            --platform linux/amd64 \
            --format oci \
            --build-arg "FIXTURE_SOURCE_SHA=${GITHUB_SHA}" \
            --build-arg "BOOTSTRAP_CA_BUNDLE_SHA256=${ca_bundle_sha256}" \
            --build-arg "SNAPSHOT_SOURCES_SHA256=${snapshot_sources_sha256}" \
            --file "$build_context/Dockerfile" \
            --tag "$image" \
            "$build_context"
          test "$(podman_short image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/amd64
          test "$(podman_short image inspect --format '{{index .Labels "io.leetplus.fixture"}}' "$image")" = langame-booted-systemd-base-v1
          test "$(podman_short image inspect --format '{{index .Labels "org.opencontainers.image.revision"}}' "$image")" = "$GITHUB_SHA"
          test "$(podman_short image inspect --format '{{index .Labels "io.leetplus.fixture.bootstrap-ca-bundle-sha256"}}' "$image")" = "$ca_bundle_sha256"
          test "$(podman_short image inspect --format '{{index .Labels "io.leetplus.fixture.snapshot-sources-sha256"}}' "$image")" = "$snapshot_sources_sha256"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          podman_short run --rm \
            --network none \
            --entrypoint /usr/bin/bash \
            "$image" -p -ceu '
              test "$(dpkg-query -W systemd | cut -f2)" = 255.4-1ubuntu8.17
              test "$(dpkg-query -W dbus | cut -f2)" = 1.14.10-4ubuntu4.1
              sha256sum --check /usr/share/leetplus-langame-fixture/dpkg-packages.sha256
              test -s /usr/lib/systemd/system/leetplus-langame-fixture.target
            '

          # Prove the published base can boot systemd and isolate DynamicUser
          # from manager transports while preserving kernel cgroup evidence.
          # Ubuntu's dbus-daemon cannot authenticate DynamicUser (systemd
          # upstream #22737), so unprivileged production code must not depend
          # on that backend. Container-local privilege remains confined to a
          # rootless auto user namespace.
          container_id="$(podman_long run --detach \
            --name "$container" \
            --hostname leetplus-langame-bootstrap \
            --label "$label" \
            --env container=podman \
            --pull=never \
            --systemd=always \
            --userns=auto:size=65536 \
            --privileged \
            --read-only \
            --cgroups=enabled \
            --cgroupns=private \
            --network=none \
            --pids-limit=256 \
            --memory=1g \
            --tmpfs /run:rw,nosuid,nodev,mode=755,size=128m \
            --tmpfs /run/lock:rw,nosuid,nodev,mode=755,size=16m \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=32m \
            --tmpfs /var/lib/systemd/timers:rw,nosuid,nodev,noexec,mode=755,size=16m \
            "$image")"
          test "$container_id" = "$(podman_short ps -q --no-trunc --filter "label=${label}")"
          host_pid="$(podman_short inspect --format '{{.State.Pid}}' "$container")"
          test "$(stat -Lc '%i' /proc/self/ns/user)" != "$(stat -Lc '%i' "/proc/${host_pid}/ns/user")"
          awk -v outer_id="$(id -u)" '
            NF != 3 { exit 1 }
            $1 == 0 && $3 >= 65536 && !(outer_id >= $2 && outer_id < $2 + $3) { covers = 1 }
            END { exit(covers == 1 ? 0 : 1) }
          ' "/proc/${host_pid}/uid_map"
          awk -v outer_id="$(id -g)" '
            NF != 3 { exit 1 }
            $1 == 0 && $3 >= 65536 && !(outer_id >= $2 && outer_id < $2 + $3) { covers = 1 }
            END { exit(covers == 1 ? 0 : 1) }
          ' "/proc/${host_pid}/gid_map"
          deadline=$((SECONDS + 75))
          boot_ready=false
          while ((SECONDS < deadline)); do
            if timeout --foreground --kill-after=2s 8s /usr/bin/podman exec "$container" /usr/bin/bash -p -ceu '
              test "$(cat /proc/1/comm)" = systemd
              test "$(systemctl show -p ActiveState --value dbus.socket)" = active
              test "$(systemctl show -p ActiveState --value dbus.service)" = active
              test -d /var/lib/systemd/timers
              owner="$(busctl --system call org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus GetNameOwner s org.freedesktop.systemd1)"
              [[ "$owner" =~ ^s[[:space:]]+\":[1-9][0-9]*\.[0-9]+\"$ ]]
            ' >/dev/null 2>&1; then
              boot_ready=true
              break
            fi
            sleep 0.25
          done
          test "$boot_ready" = true
          timeout --foreground --kill-after=5s 30s /usr/bin/podman exec "$container" /usr/bin/bash -p -ceu '
            systemd-run --quiet --wait --pipe --collect \
              --unit=leetplus-langame-bootstrap-dynamic-isolation.service \
              --property=DynamicUser=yes \
              --property=NoNewPrivileges=yes \
              --property=ProtectControlGroups=yes \
              --property=RestrictNamespaces=yes \
              --property="InaccessiblePaths=/run/dbus /run/systemd/private" \
              /usr/bin/bash -p -ceu '\''
                expected=/system.slice/leetplus-langame-bootstrap-dynamic-isolation.service
                mapfile -t cgroups < /proc/self/cgroup
                [[ "${#cgroups[@]}" == 1 && "${cgroups[0]}" == "0::${expected}" ]]
                mapfile -t pids < "/sys/fs/cgroup${expected}/cgroup.procs"
                [[ "${#pids[@]}" == 1 && "${pids[0]}" == "$$" ]]
                [[ "${INVOCATION_ID:-}" =~ ^[0-9a-f]{32}$ ]]
                [[ ! -e /run/dbus/system_bus_socket && ! -e /run/systemd/private ]]
                if /usr/bin/busctl --system call org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus GetNameOwner s org.freedesktop.systemd1 >/dev/null 2>&1; then
                  exit 40
                fi
              '\''
          '
          retired_container_id="$container_id"
          timeout --foreground --kill-after=5s 20s /usr/bin/podman stop --time 10 "$container" >/dev/null || true
          podman_short rm -f "$container" >/dev/null
          container_id=''
          for _ in {1..40}; do
            if [[ -z "$(find /sys/fs/cgroup -type d \
              \( -name "*${retired_container_id}*" -o -name "*${retired_container_id:0:12}*" \) \
              -print -quit 2>/dev/null)" ]]; then
              break
            fi
            sleep 0.1
          done
          test -z "$(find /sys/fs/cgroup -type d \
            \( -name "*${retired_container_id}*" -o -name "*${retired_container_id:0:12}*" \) \
            -print -quit 2>/dev/null)"

          podman_long push \
            --authfile "$auth_file" \
            --digestfile "$digest_file" \
            "$image"
          digest="$(tr -d '\r\n' < "$digest_file")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'PUBLISHED_IMAGE=%s@%s\n' "${image%%:*}" "$digest"
          printf 'PUBLISHED_DIGEST=%s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
          printf 'BOOTSTRAP_CA_BUNDLE_SHA256=%s\n' "$ca_bundle_sha256" >> "$GITHUB_STEP_SUMMARY"
          printf 'SNAPSHOT_SOURCES_SHA256=%s\n' "$snapshot_sources_sha256" >> "$GITHUB_STEP_SUMMARY"
