# Dedicated LeetPlus Telegram Bot API egress bridge.
#
# The listener exists only on the private leetplus_telegram_edge Docker
# bridge. Only the statically assigned telegram-poller address is admitted.
# Privoxy keeps api.telegram.org as a hostname and delegates name resolution
# to Tor; this prevents router fake-IP answers (198.18.0.0/15) from entering
# the local transparent redsocks path.

confdir /etc/privoxy
templdir /usr/share/privoxy/templates
logdir /var/log/privoxy
logfile logfile

listen-address 172.25.0.1:18118
permit-access 172.25.0.10

toggle 1
enable-remote-toggle 0
enable-remote-http-toggle 0
enable-edit-actions 0
enforce-blocks 1
accept-intercepted-requests 0
enable-proxy-authentication-forwarding 0

buffer-limit 4096
socket-timeout 70
keep-alive-timeout 5
connection-sharing 0
forwarded-connect-retries 1

forward-socks5t / 127.0.0.1:9050 .
