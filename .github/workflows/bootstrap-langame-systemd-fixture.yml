name: Bootstrap Langame systemd fixture image

on:
  push:
    branches:
      - codex/langame-systemd-fixture-bootstrap
    paths:
      - .github/fixtures/langame-systemd-noble/Dockerfile
      - .github/fixtures/langame-systemd-noble/leetplus-langame-fixture.target
      - .github/workflows/bootstrap-langame-systemd-fixture.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: langame-systemd-fixture-bootstrap-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact fixture source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build, attest and publish one immutable amd64 image
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = x86_64
          command -v podman >/dev/null
          image="ghcr.io/boozik3412/leetplus-langame-systemd-fixture:bootstrap-${GITHUB_SHA}"
          auth_file="$RUNNER_TEMP/leetplus-langame-systemd-fixture-auth.json"
          digest_file="$RUNNER_TEMP/leetplus-langame-systemd-fixture.digest"
          trap 'podman logout --authfile "$auth_file" ghcr.io >/dev/null 2>&1 || true; rm -f -- "$auth_file" "$digest_file"' EXIT
          test ! -e "$auth_file"
          test ! -e "$digest_file"
          printf '%s' "$GHCR_TOKEN" | podman login \
            --authfile "$auth_file" \
            --username "$GITHUB_ACTOR" \
            --password-stdin \
            ghcr.io >/dev/null
          podman build \
            --pull-always \
            --platform linux/amd64 \
            --format oci \
            --build-arg "FIXTURE_SOURCE_SHA=${GITHUB_SHA}" \
            --file .github/fixtures/langame-systemd-noble/Dockerfile \
            --tag "$image" \
            .github/fixtures/langame-systemd-noble
          test "$(podman image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/amd64
          test "$(podman image inspect --format '{{index .Labels "io.leetplus.fixture"}}' "$image")" = langame-booted-systemd-base-v1
          test "$(podman image inspect --format '{{index .Labels "org.opencontainers.image.revision"}}' "$image")" = "$GITHUB_SHA"
          podman run --rm \
            --network none \
            --entrypoint /usr/bin/bash \
            "$image" -p -ceu '
              test "$(dpkg-query -W systemd | cut -f2)" = 255.4-1ubuntu8.17
              test "$(dpkg-query -W dbus | cut -f2)" = 1.14.10-4ubuntu4.1
              sha256sum --check /usr/share/leetplus-langame-fixture/dpkg-packages.sha256
              test -s /usr/lib/systemd/system/leetplus-langame-fixture.target
            '
          podman push \
            --authfile "$auth_file" \
            --digestfile "$digest_file" \
            "$image"
          digest="$(tr -d '\r\n' < "$digest_file")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'PUBLISHED_IMAGE=%s@%s\n' "${image%%:*}" "$digest"
          printf 'PUBLISHED_DIGEST=%s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
