<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Схема клуба</title>
<style>
@font-face{font-family:Manrope;font-style:normal;font-weight:400 800;font-display:swap;src:url(/landing/fonts/manrope-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;font-style:normal;font-weight:400 800;font-display:swap;src:url(/landing/fonts/manrope-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Layout: full-bleed 3D stage under a slim app bar; KPI tiles float top-left, zone panel docks right (bottom sheet on phones), live feed bottom-left. */
:root{
  --bg:#E9F0F0; --surface:#FFFFFF; --surface-2:#F3F7F7; --fg:#0B191D; --muted:#5A6D71; --line:#DCE6E7;
  --accent:#007681; --accent-soft:#D9F1F2; --on-accent:#FFFFFF;
  --good:#22966A; --good-soft:#DDF3E9; --warn:#C7741C; --warn-soft:#FBEBD8; --lilac:#7A63D6; --lilac-soft:#ECE7FB; --rose:#C24D73; --rose-soft:#FBE4EC; --bad:#C9455A;
  --shadow:0 10px 30px rgba(11,25,29,.10), 0 2px 6px rgba(11,25,29,.06);
  --font:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-lg:18px; --r-md:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071317; --surface:#0F2227; --surface-2:#152C32; --fg:#F4FBFC; --muted:#93AEB3; --line:#1F3A40;
  --accent:#83E4EC; --accent-soft:#12383D; --on-accent:#071317;
  --good:#5BD6A0; --good-soft:#123A2C; --warn:#F2B15E; --warn-soft:#3A2C17; --lilac:#B7A6FF; --lilac-soft:#2A2448; --rose:#FF9DBB; --rose-soft:#3B1C29; --bad:#FF8A9A;
  --shadow:0 10px 30px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071317; --surface:#0F2227; --surface-2:#152C32; --fg:#F4FBFC; --muted:#93AEB3; --line:#1F3A40;
  --accent:#83E4EC; --accent-soft:#12383D; --on-accent:#071317;
  --good:#5BD6A0; --good-soft:#123A2C; --warn:#F2B15E; --warn-soft:#3A2C17; --lilac:#B7A6FF; --lilac-soft:#2A2448; --rose:#FF9DBB; --rose-soft:#3B1C29; --bad:#FF8A9A;
  --shadow:0 10px 30px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column}
.top{flex:none;height:60px;display:flex;align-items:center;gap:14px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:5}
.logo{height:26px;width:auto;display:block;flex:none}
.logo .mk{fill:var(--accent)} .logo .tx{fill:var(--fg)}
.vsep{width:1px;height:28px;background:var(--line);flex:none}
.club{display:flex;align-items:center;gap:10px;min-width:0;padding:6px 10px 6px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
.club .ic{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.club b{display:block;font-size:13px;font-weight:700;white-space:nowrap}
.club span{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.demo{font-size:11px;font-weight:600;color:var(--muted);border:1px dashed var(--line);padding:5px 9px;border-radius:999px;white-space:nowrap}
.live{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--good-soft);color:var(--good);white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}

#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.pointer{cursor:pointer}
#gl:active{cursor:grabbing}

.kpis{position:absolute;top:14px;left:max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;z-index:3;
  max-width:calc(100% - 340px - 110px);overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.kpis::-webkit-scrollbar{display:none}
.kpi{flex:none;display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:10px 14px 10px 10px;box-shadow:var(--shadow);min-width:0}
.kpi .kic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi .kic svg{width:18px;height:18px}
.kpi small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.kpi b{display:block;font-size:20px;white-space:nowrap;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.kpi em{font-style:normal;font-size:11px;font-weight:700;color:var(--good);white-space:nowrap}
.kpi em.muted{color:var(--muted);font-weight:600}
.kpi[data-k="admin"]{cursor:pointer}
.kpi.hl{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.kpi{transition:box-shadow .15s ease}
.tip .tl{display:block;font-weight:600;opacity:.8;margin-top:2px}
.flash{animation:flash .9s ease}
@keyframes flash{0%{color:var(--accent)}100%{}}

.tools{position:absolute;top:14px;right:calc(max(16px,env(safe-area-inset-right,0px)) + 340px + 12px);display:flex;flex-direction:column;gap:2px;
  background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:4px;z-index:3}
.tools button{width:34px;height:34px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.tools button:hover{background:var(--surface-2);color:var(--fg)}
.tools button[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.tools svg{width:18px;height:18px}

.panel{position:absolute;top:14px;bottom:14px;right:max(16px,env(safe-area-inset-right,0px));width:340px;background:var(--surface);border-radius:var(--r-lg);
  box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:4;overflow:hidden}
.panel .grab{display:none}
.pbody{overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:18px;flex:1;min-height:0}
.ph{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ph h2{margin:2px 0 0;font-size:19px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.ph .sub{font-size:12px;color:var(--muted);margin-top:3px}
.back{border:0;background:var(--surface-2);border-radius:9px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;align-self:flex-start;color:var(--muted)}
.back:hover{color:var(--fg)}
.chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.lilac{background:var(--lilac-soft);color:var(--lilac)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:11px;padding:9px 10px;min-width:0}
.stat small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{display:block;font-size:16px;font-weight:800;margin-top:2px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.sec h3 span{letter-spacing:0;text-transform:none;font-weight:600}
.zrow{display:grid;grid-template-columns:10px 1fr auto;gap:4px 10px;align-items:center;border:0;background:transparent;border-radius:11px;padding:8px 9px;margin:0 -9px;cursor:pointer;text-align:left}
.zrow:hover{background:var(--surface-2)}
.zrow .dot{width:10px;height:10px;border-radius:3px}
.zrow b{font-size:13px;font-weight:700}
.zrow .v{font-size:12.5px;font-weight:700}
.bar{grid-column:2/4;height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.zrow:hover .bar{background:var(--bg)}
.bar i{display:block;height:100%;border-radius:9px;transition:width .6s ease}
.prog{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow span{display:block;color:var(--muted);font-size:11.5px}
.li .r{font-weight:800;white-space:nowrap}
.ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#0B191D;flex:none}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.seat{border:0;border-radius:10px;padding:7px 7px 6px;text-align:left;cursor:pointer;background:var(--surface-2);border-left:3px solid var(--sc);min-width:0}
.seat:hover{outline:1.5px solid var(--sc)}
.seat b{display:block;font-size:11.5px;font-weight:800}
.seat span{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.guest{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:14px;padding:12px}
.guest .ava{width:44px;height:44px;font-size:14px}
.guest b{font-size:15px;font-weight:800;display:block}
.guest span{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn:hover{filter:brightness(1.06)}
.note{font-size:11px;color:var(--muted)}

.feed{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:14px;width:330px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px 6px;z-index:3}
.feed h4{margin:0 0 4px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.feed h4 span{text-transform:none;letter-spacing:0;font-weight:600}
.ev{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:12px;line-height:1.3}
.ev:first-of-type{border-top:0}
.ev .eic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center}
.ev .eic svg{width:13px;height:13px}
.ev time{font-size:10.5px;color:var(--muted)}
.ev.new{animation:evin .5s ease}
@keyframes evin{from{opacity:.2;transform:translateY(-6px)}to{opacity:1;transform:none}}

#overlay{position:absolute;inset:0;pointer-events:none;z-index:2}
#lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.card{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);
  padding:9px 13px 10px;min-width:150px;border:0;text-align:left;transition:opacity .25s}
.card:hover{transform-origin:center}
.card .cl{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted)}
.card .cl i{width:7px;height:7px;border-radius:50%}
.card .cv{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-top:1px;white-space:nowrap}
.card .cs{font-size:11px;color:var(--muted);white-space:nowrap}
.card.hide,.pin.hide,.pill.hide{opacity:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.18);transition:opacity .25s}
.pin::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid currentColor;animation:ring 2.2s infinite;opacity:.0}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}
.pill{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;border:0;background:var(--surface);border-radius:999px;
  padding:3px 8px 3px 6px;font-size:10.5px;font-weight:800;display:flex;gap:5px;align-items:center;box-shadow:0 3px 10px rgba(11,25,29,.14);white-space:nowrap;transition:opacity .2s}
.pill i{width:7px;height:7px;border-radius:50%}
.tip{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 14px));background:var(--fg);color:var(--bg);border-radius:10px;padding:7px 10px;font-size:11.5px;font-weight:600;pointer-events:none;z-index:6;white-space:nowrap}
.tip b{font-weight:800}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:10px;z-index:7;transition:opacity .3s}


.editbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.editbtn svg{width:15px;height:15px}
.editbtn:hover{border-color:var(--accent);color:var(--accent)}
.editbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
body.editing .feed{display:none}
body.editing #gl{cursor:default}
body.editing #gl.pointer{cursor:move}
.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;background:var(--surface);color:var(--muted);font-size:11.5px;font-weight:600;padding:7px 12px;border-radius:999px;box-shadow:var(--shadow);white-space:nowrap;pointer-events:none;transition:opacity .6s}
.hint.gone{opacity:0}
.otb{position:absolute;left:0;top:0;z-index:4;display:flex;gap:2px;background:var(--surface);border-radius:11px;box-shadow:var(--shadow);padding:3px}
.otb button{width:30px;height:30px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.otb button:hover{background:var(--surface-2)}
.otb button.danger{color:var(--bad)}
.otb svg{width:16px;height:16px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:11px;font-weight:700;text-align:center;line-height:1.2;color:var(--fg)}
.cat svg{width:34px;height:30px;color:var(--accent)}
.cat:hover{border-color:var(--accent);background:var(--accent-soft)}
.selbox{background:var(--surface-2);border-radius:14px;padding:12px}
.selname{font-size:15px;font-weight:800}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:11.5px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sw{display:flex;gap:8px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);background:var(--c);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.rng{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px;align-items:center}
.rng input{grid-column:1/3;width:100%;accent-color:var(--accent)}
.chk{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.danger{color:var(--bad)}
.linkbtn{border:0;background:none;padding:0;font-size:12px;font-weight:700;color:var(--muted);text-decoration:underline;cursor:pointer;align-self:flex-start;text-align:left}
.linkbtn:hover{color:var(--bad)}
@media (max-width:760px){.editbtn span{display:none}.editbtn{padding:7px}.hint{display:none}}
@media (max-width:1100px){ .feed{display:none} }
@media (max-width:760px){
  .demo{display:none} .vsep{display:none} .club span{display:none}
  .kpis{max-width:calc(100% - 32px);top:10px}
  .kpi{min-width:0;padding:8px 12px 8px 8px} .kpi .kic{width:30px;height:30px} .kpi b{font-size:17px}
  .tools{display:none}
  .panel{top:auto;bottom:max(10px,env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;max-height:56%}
  .panel .grab{display:block;border:0;background:transparent;padding:10px 0 14px;margin-bottom:-12px;cursor:pointer;width:100%;touch-action:none;position:relative;z-index:1}
  .panel .ph{cursor:pointer;touch-action:none}
  .panel .grab::before{content:"";display:block;margin:auto;width:40px;height:4px;border-radius:9px;background:var(--line)}
  .panel.collapsed .pbody>*:not(.ph){display:none}
  .pbody{padding:10px 16px 16px;gap:14px}
  .card{min-width:0;padding:5px 9px 6px;border-radius:10px} .card .cs{display:none} .card .cv{font-size:13px}
  .card .cl{font-size:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
.live.stale i{background:var(--warn);animation:none}
.live.off i{background:var(--muted);animation:none}
.demo.warn{color:var(--warn)}
.feed .empty{font-size:12px;color:var(--muted);padding:2px 0}
.chip.off{background:var(--surface-2);color:var(--muted)}
.buys .t{flex:none;width:38px;color:var(--muted);font-weight:700;font-size:11.5px}
#stage{--pw:340px}
.kpis{max-width:calc(100% - 32px - var(--pw) - 12px);flex-wrap:wrap;overflow:visible;padding-bottom:0}
.tools{top:auto;right:auto;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);flex-direction:row}
.panel .more{display:none}
@media (max-width:760px){.kpis{max-width:calc(100% - 32px);flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}}
.gamesec .gline{display:none}
.games .gk{flex:none;font-size:10.5px;padding:2px 0;width:58px;justify-content:center;text-align:center}
.games .li{align-items:center}
.gseason{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--accent-soft)}
.gseason .grow{display:flex;flex-direction:column;min-width:0;flex:1}
.gseason b{font-size:12.5px}
.gseason .grow span{font-size:11px;color:var(--muted)}
.gseason .r{font-size:11.5px;color:var(--muted);white-space:nowrap}
.games .r{font-size:11.5px;color:var(--muted);white-space:nowrap}
.gamesec .gbody{display:flex;flex-direction:column;gap:8px}
.fsec{gap:0;flex:none;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.games .li b{white-space:normal;overflow:visible;text-overflow:clip;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.ntseg button{all:unset;box-sizing:border-box;min-height:34px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--surface-2);color:var(--fg);display:inline-flex;align-items:center}
