      - name: Validate fail-closed CURRENT180-CURRENT190 disposable PostgreSQL rehearsal
        run: pnpm --filter database check:current180-current190-disposable-postgresql-rehearsal
        env:
          NODE_ENV: test

      - name: Validate independent tenant enrollment command authority
        run: pnpm --filter database check:identity-mail-tenant-enrollment-authority

      - name: Validate sealed CURRENT185 tenant enrollment coordinator boundary
        run: pnpm --filter database check:identity-mail-tenant-enrollment-coordinator-current185

      - name: Validate CURRENT185 identity-mail duty-role grants catalog
        run: pnpm --filter database check:identity-mail-duty-role-grants-current185

      - name: Validate CURRENT185 signed identity-mail duty-role manifest
        run: pnpm --filter database check:identity-mail-duty-role-manifest-current185

      - name: Validate manifest-bound identity-mail tenant enrollment authority V2
        run: pnpm --filter database check:identity-mail-tenant-enrollment-authority-v2

      - name: Validate successor identity-mail duty-role Manifest V2
        run: pnpm --filter database check:identity-mail-duty-role-manifest-v2

      - name: Validate two-PINNED identity-mail enrollment composition V2
        run: pnpm --filter database check:identity-mail-tenant-enrollment-manifest-bound-v2

      - name: Validate sealed owner-only enrollment evidence importer V2
        run: pnpm --filter database check:identity-mail-tenant-enrollment-evidence-importer-v2

      - name: Validate independent identity-mail worker runtime attestation
        run: pnpm --filter database check:identity-mail-worker-runtime-attestation

      - name: Validate shared beta admission provenance
        run: pnpm --filter database check:shared-beta-admission-provenance

      - name: Validate dormant identity mail PENDING enum expansion
        run: pnpm --filter database check:identity-mail-outbox-pending-enum

      - name: Validate independent build and deployment provenance
        run: pnpm --filter database check:shared-beta-runtime-release-provenance

      - name: Validate atomic shared beta activation contract
        run: pnpm --filter database check:shared-beta-runtime-release-activation

      - name: Validate populated runtime activation upgrade rehearsal
        run: pnpm --filter database check:shared-beta-runtime-release-activation-upgrade

      - name: Validate identity email claim and invite writer boundaries
        run: pnpm --filter database check:identity-email-claim-boundary

      - name: Validate legacy identity read-only inventory
        run: pnpm --filter database check:identity-legacy-backfill-inventory

      - name: Verify legacy identity exact-head release artifact
        env:
          RELEASE_SHA: ${{ env.CI_RELEASE_SHA }}
        run: >-
          pnpm --filter database
          check:identity-legacy-backfill-release-artifact

      - name: Test database seed safety
        run: pnpm --filter database test:seed-safety

      - name: Lint API security, health, and configuration boundary
        run: pnpm --filter api lint:ci:boundary

      - name: Lint invite secret transport
        run: pnpm --filter api lint:ci:invite-secret-transport

      - name: Lint tenant execution admission boundary
        run: pnpm --filter api lint:ci:tenant-execution

      - name: Lint isolated design-partner runtime boundary
        run: pnpm --filter api lint:ci:design-partner

      - name: Lint identity-mail worker and SENT boundary
        run: pnpm --filter api lint:ci:identity-mail-worker

      - name: Lint identity-mail PostgreSQL acceptance seams
        run: pnpm --filter api lint:ci:identity-mail-worker-pg

      - name: Lint Langame staged onboarding boundary
        run: pnpm --filter api lint:ci:langame-onboarding

      - name: Lint CURRENT189 employee invitation boundary
        run: pnpm --filter api lint:ci:employee-invite-current189

      - name: Lint dormant CURRENT189 employee invitation route policy
        run: pnpm --filter api lint:ci:employee-invite-current189-route-policy

      - name: Lint dormant CURRENT189 employee invitation HTTP candidate
        run: pnpm --filter api lint:ci:employee-invite-current189-http-candidate

      - name: Lint dormant CURRENT189 employee invitation worker
        run: pnpm --filter api lint:ci:employee-invite-worker-current189

      - name: Lint dormant CURRENT189 employee invitation runtime
        run: pnpm --filter api lint:ci:employee-invite-runtime-current189

      - name: Lint CURRENT190 persisted guest session boundary
        run: pnpm --filter api lint:ci:guest-portal-current190

      - name: Lint dormant CURRENT190 application route policy
        run: pnpm --filter api lint:ci:guest-portal-current190-route-policy

      - name: Lint dormant CURRENT190 application controller
        run: pnpm --filter api lint:ci:guest-portal-current190-application

      - name: Lint Gate 1MT pilot HTTP and fresh store-scope boundary
        run: pnpm --filter api lint:ci:pilot-http-surface

      - name: Lint Gate 1MT team-chat PostgreSQL matrix
        run: pnpm --filter api lint:ci:pilot-team-chat-pg

      - name: Lint Gate 1MT CRM communications boundary
        run: pnpm --filter api lint:ci:pilot-crm-communications

      - name: Lint Gate 1MT CRM communications PostgreSQL matrix
        run: pnpm --filter api lint:ci:pilot-crm-communications-pg

      - name: Lint Gate 1MT users and roles PostgreSQL matrix
        run: pnpm --filter api lint:ci:pilot-users-roles-pg

      - name: Test isolated design-partner runtime boundary
        run: pnpm --filter api test:ci:design-partner

      - name: Test identity-mail worker and SENT boundary
        run: pnpm --filter api test:ci:identity-mail-worker

      - name: Test dormant CURRENT184 provider lost-response boundary
        run: pnpm --filter api test:ci:identity-mail-provider-boundary

      - name: Test dormant CURRENT188 Langame onboarding adapter
        run: pnpm --filter api test:ci:langame-onboarding

      - name: Test dormant CURRENT189 employee invitation boundary
        run: pnpm --filter api test:ci:employee-invite-current189

      - name: Test dormant CURRENT189 employee invitation route policy
        run: pnpm --filter api test:ci:employee-invite-current189-route-policy

      - name: Test dormant CURRENT189 employee invitation HTTP candidate
        run: pnpm --filter api test:ci:employee-invite-current189-http-candidate

      - name: Test dormant CURRENT189 employee invitation worker
        run: pnpm --filter api test:ci:employee-invite-worker-current189

      - name: Test dormant CURRENT189 employee invitation runtime
        run: pnpm --filter api test:ci:employee-invite-runtime-current189

      - name: Test dormant CURRENT190 persisted guest session boundary
        run: pnpm --filter api test:ci:guest-portal-current190

      - name: Test dormant CURRENT190 application route policy
        run: pnpm --filter api test:ci:guest-portal-current190-route-policy

      - name: Test dormant CURRENT190 application controller
        run: pnpm --filter api test:ci:guest-portal-current190-application

      - name: Run focused API security tests
        run: pnpm --filter api test:ci:focused

      - name: Test Gate 1MT pilot HTTP and fresh store-scope boundary
        run: pnpm --filter api test:ci:pilot-http-surface

      - name: Test Gate 1MT CRM communications boundary
        run: pnpm --filter api test:ci:pilot-crm-communications

      - name: Verify invite secret transport routes
        run: pnpm --filter api test:e2e:invite-secret-transport

      - name: Run tenant execution admission tests
        run: pnpm --filter api test:ci:tenant-execution

      - name: Run background execution containment tests
        run: pnpm --filter api test:ci:background-execution

      - name: Run full API test suite
        run: pnpm --filter api test:ci

      - name: Type-check API
        run: pnpm --filter api typecheck

      - name: Build API
        run: pnpm --filter api build

      - name: Validate production startup contract
        run: pnpm --filter api config:validate:production
        env:
          NODE_ENV: production
          JWT_SECRET: ci-contract-jwt-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GUEST_PORTAL_JWT_SECRET: ci-contract-guest-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          GUEST_GAME_REFERRAL_SECRET: ci-contract-referral-ddddddddddddddddddddddddddddddd
          APP_ENCRYPTION_KEY: ci-contract-pii-eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          INTEGRATION_ENCRYPTION_KEY: ci-contract-integration-ffffffffffffffffffffffffffffffff
          IDENTITY_EMAIL_FINGERPRINT_HMAC_KEY: ci-contract-identity-hhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh
          IDENTITY_EMAIL_FINGERPRINT_HMAC_KEY_VERSION: v1
          IDENTITY_MAIL_ENCRYPTION_KEY: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA
          IDENTITY_MAIL_ENCRYPTION_KEY_VERSION: v1
          IDENTITY_MAIL_AAD_ENVIRONMENT: ci
          SYNC_SERVICE_TOKEN: ci-contract-scheduler-gggggggggggggggggggggggggggggggg
          RELEASE_SHA: ${{ env.CI_RELEASE_SHA }}
          BUILD_TIME: "2026-07-26T00:00:00Z"
          EXPECTED_DATABASE_MIGRATION: 20260804120000_guest_game_max_pending_rewards
          EXPECTED_DATABASE_MIGRATION_COUNT: "180"
          ACCESS_SCOPE_ENFORCEMENT_MODE: ENFORCED
          STAFF_ATTACHMENT_ACL_MODE: SHADOW

      - name: Test web invite secret transport
        run: pnpm --filter web test:invite-secret-transport

      - name: Test pilot BFF authentication and cache boundary
        run: pnpm --filter web test:pilot-bff-boundary

      - name: Test users and roles BFF boundary
        run: pnpm --filter web test:users-roles-bff-boundary

      - name: Test reproducible web build boundary
        run: pnpm --filter web test:release-build-boundary

      - name: Test guest session HttpOnly transport boundary
        run: pnpm --filter web test:guest-session-transport

      - name: Test dormant CURRENT190 Web BFF cutover candidate
        run: pnpm --filter web test:guest-session-current190-bff-candidate

      - name: Test dormant CURRENT188 Langame Web BFF candidate
        run: pnpm --filter web test:langame-current188-bff-candidate

      - name: Test dormant CURRENT189 employee invitation Web BFF candidate
        run: pnpm --filter web test:employee-invite-current189-bff-candidate

      - name: Lint web
        run: pnpm --filter web lint

      - name: Type-check web
        run: pnpm --filter web typecheck

      - name: Build web
        run: pnpm --filter web build

      - name: Create deterministic release artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_RELEASE_SHA"

          release_root="$RUNNER_TEMP/leetplus-release-$CI_RELEASE_SHA"
          archive="$RUNNER_TEMP/leetplus-release-$CI_RELEASE_SHA.tar.gz"
          mkdir -p \
            "$release_root/apps/api" \
            "$release_root/apps/web" \
            "$release_root/packages/database/prisma"

          cp -a apps/api/dist "$release_root/apps/api/"
          cp -a apps/web/.next "$release_root/apps/web/"
          cp -a packages/database/prisma/schema.prisma "$release_root/packages/database/prisma/"
          cp -a packages/database/prisma/migrations "$release_root/packages/database/prisma/"
          cp -a package.json pnpm-lock.yaml pnpm-workspace.yaml "$release_root/"

          printf '%s\n' \
            '{' \
            "  \"releaseSha\": \"$CI_RELEASE_SHA\"," \
            '  "nodeVersion": "22",' \
            '  "pnpmVersion": "10.33.2",' \
            '  "databaseMigration": "20260804120000_guest_game_max_pending_rewards",' \
            '  "databaseMigrationCount": 180' \
            '}' > "$release_root/release-provenance.json"

          (
            cd "$release_root"
            if find . \
              -path './apps/web/.next/cache' -prune -o \
              -type l -print -quit \
              | grep -q .; then
              printf 'Release artifact refuses symbolic links\n' >&2
              exit 1
            fi
            find . \
              -path './apps/web/.next/cache' -prune -o \
              -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --format=posix \
            --pax-option=delete=atime,delete=ctime \
            --exclude='./apps/web/.next/cache' \
            -C "$release_root" \
            -cf - . \
            | gzip -n > "$archive"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256"
            sha256sum --check "$(basename "$archive").sha256"
          )
          gzip --test "$archive"

      - name: Upload SHA-bound release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leetplus-release-${{ env.CI_RELEASE_SHA }}
          path: |
            ${{ runner.temp }}/leetplus-release-${{ env.CI_RELEASE_SHA }}.tar.gz
            ${{ runner.temp }}/leetplus-release-${{ env.CI_RELEASE_SHA }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  migration-smoke:
    name: PostgreSQL migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PGOPTIONS: -c lock_timeout=5000 -c statement_timeout=120000

    services:
      postgres:
        image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leetplus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CI_RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact release checkout
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'CI_RELEASE_SHA=%s\n' "$CI_RELEASE_SHA"
          test "$actual_sha" = "$CI_RELEASE_SHA"

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter database db:validate

      - name: Generate Prisma client
        run: pnpm --filter database db:generate

      - name: Apply all migrations to a clean database
        run: pnpm --filter database db:deploy

      - name: Rehearse tenant execution control-plane 162 to 163 upgrade and lock timeout
        run: pnpm --filter database db:smoke:tenant-execution-control-plane-upgrade
        env:
          TENANT_EXECUTION_CONTROL_PLANE_UPGRADE_SMOKE_CONFIRM: run-tenant-execution-control-plane-upgrade-smoke

      - name: Rehearse tenant execution revision fence 163 to 164 upgrade and rollback
        run: pnpm --filter database db:smoke:tenant-execution-revision-fence-upgrade
        env:
          TENANT_EXECUTION_REVISION_FENCE_UPGRADE_SMOKE_CONFIRM: run-tenant-execution-revision-fence-upgrade-smoke

      - name: Rehearse Store background execution fence 164 to 165 upgrade and rollback
        run: pnpm --filter database db:smoke:store-background-execution-fence-upgrade
        env:
          STORE_BACKGROUND_EXECUTION_FENCE_UPGRADE_SMOKE_CONFIRM: run-store-background-execution-fence-upgrade-smoke

      - name: Rehearse tenant delivery claims 165 to 166 upgrade and rollback
        run: pnpm --filter database db:smoke:tenant-delivery-claim-upgrade
        env:
          TENANT_DELIVERY_CLAIM_UPGRADE_SMOKE_CONFIRM: run-tenant-delivery-claim-upgrade-smoke

      - name: Verify database connectivity and migration state
        run: pnpm --filter database db:smoke

      - name: Verify runtime function ACL enrollment on a disposable role
        run: pnpm --filter database db:smoke:runtime-function-enrollment
        env:
          RUNTIME_FUNCTION_ENROLLMENT_SMOKE_CONFIRM: run-runtime-function-enrollment-smoke

      - name: Verify global identity email claim invariants
        run: pnpm --filter database db:smoke:identity-email-claim
        env:
          IDENTITY_EMAIL_CLAIM_SMOKE_CONFIRM: run-identity-email-claim-smoke

      - name: Rehearse identity activation locator CURRENT_169 to CURRENT_170 upgrade
        run: pnpm --filter database db:smoke:identity-activation-locator-upgrade
        env:
          IDENTITY_ACTIVATION_LOCATOR_UPGRADE_SMOKE_CONFIRM: run-identity-activation-locator-upgrade-smoke

      - name: Rehearse dormant OWNER invite HOLD outbox CURRENT_170 to CURRENT_171 upgrade
        run: pnpm --filter database db:smoke:identity-owner-invite-hold-outbox-upgrade
        env:
          IDENTITY_OWNER_INVITE_HOLD_OUTBOX_UPGRADE_SMOKE_CONFIRM: run-identity-owner-invite-hold-outbox-upgrade-smoke

      - name: Rehearse shared beta admission provenance CURRENT_171 to CURRENT_172 upgrade
        run: pnpm --filter database db:smoke:shared-beta-admission-provenance-upgrade
        env:
